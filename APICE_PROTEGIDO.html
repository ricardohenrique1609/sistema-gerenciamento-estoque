i><\/i>${p.conf.label}<\/span>\n          ${p.cross?'<span class=\"dkind blu\">entre prédios<\/span>':''}\n          ${p.residual>0&&p.moves.length?`<span class=\"dkind amb\">absorção parcial ${p.absorb}%<\/span>`:''}\n        <\/div>\n        <div class=\"dtitle\">${planTitle(p)}<\/div>\n        <div class=\"dmeta\">\n          <span>Quando: <b>${fdd(p.date)}<\/b>${repeats>1?` <span style=\"color:var(--tx-mut)\">· repete em +${repeats-1} dia${repeats>2?'s':''}<\/span>`:''}<\/span>\n          <span>Origem: <b>${rnd1(p.oBefore)}% → ${p.oAfter}%<\/b><\/span>\n          <span>${p.moves.length?`Absorvido: <b>${p.moved} de ${p.excess} pessoas<\/b>`:`Excesso: <b>${p.excess} pessoas<\/b>`}<\/span>\n          <span>Risco residual: <b>${planResidLabel(p)}<\/b><\/span>\n        <\/div>\n      <\/div>\n      <div class=\"dside\">\n        <div class=\"dactions\">\n          ${p.moves.length?`<button class=\"dbtn pri\" onclick=\"event.stopPropagation();openPlan3D('${p.id}')\">Ver fluxo em 3D<\/button>`:''}\n          <button class=\"dbtn\" onclick=\"event.stopPropagation();openModal('${p.origin.floor_id}','${p.date}')\">Abrir origem<\/button>\n        <\/div>\n        <span class=\"dexp\">evidência<\/span>\n      <\/div>\n    <\/div>\n    <div class=\"devi\"><div class=\"devi-in\">\n      <div>\n        <h5>Antes → depois (cenário central)<\/h5>\n        <div class=\"xrows\">\n          ${xrowHTML(`${p.origin.building_short} · ${andarLbl(p.origin.andar)}`,'origem',p.oBefore,p.oAfter)}\n          ${p.moves.map(m=>xrowHTML(`${m.rec.building_short} · ${andarLbl(m.rec.andar)}`,`destino · recebe ${m.qty} pessoas`,m.before,m.after)).join('')}\n        <\/div>\n      <\/div>\n      <div>\n        <h5>Justificativa<\/h5>\n        <p>${planNarrative(p)}<\/p>\n        ${p.alts.length?`<p style=\"margin-top:10px\"><b style=\"color:var(--tx-main);font-weight:600\">Alternativas:<\/b> ${p.alts.map(a=>`${a.rec.building_short} · ${andarLbl(a.rec.andar)} (${a.room} posições seguras)`).join('; ')}.<\/p>`:''}\n        ${planFitHTML(p)}\n      <\/div>\n    <\/div><\/div>\n  <\/div>`;\n}\nfunction emProjTxt(e){\n  if(e.already)return `Já cruzou o limite crítico em ${fdd(e.rec.data)}.`;\n  if(e.projKind==='data')return `A própria previsão indica criticidade em ${fdd(e.proj)}.`;\n  if(e.projKind==='trend')return `No ritmo atual, cruzaria o limite crítico em ~${e.projD} dia${e.projD>1?'s':''} — além do horizonte previsto.`;\n  if(e.type==='limite')return `Opera a ${rnd1(e.to)}% — a ${rnd1(90-e.to)}pp do limite crítico.`;\n  return `A previsão dos dias seguintes não confirma a escalada — acompanhar de perto.`;\n}\nfunction dcardEmerging(e,idx){\n  const r=e.rec,cf=INTEL.confidence(r);\n  const projTxt=emProjTxt(e);\n  return `<div class=\"dcard sev-amb\" id=\"dce-${idx}\">\n    <div class=\"dhead\" onclick=\"toggleDcard('dce-${idx}')\">\n      <div class=\"dhead-main\">\n        <div class=\"dtop\">\n          <span class=\"dkind amb\">Risco em formação<\/span>\n          <span class=\"conf ${cf.cls}\" title=\"${cf.desc}\"><i><\/i>${cf.label}<\/span>\n        <\/div>\n        <div class=\"dtitle\">${r.building_short} · ${andarLbl(r.andar)} sobe de ${rnd1(e.from)}% para ${rnd1(e.to)}% entre ${fdia(e.prev.data)||fd(e.prev.data)} e ${fdia(r.data)||fd(r.data)}<\/div>\n        <div class=\"dmeta\">\n          <span>Variação: <b>+${rnd1(e.delta)}pp em 1 dia<\/b><\/span>\n          <span>Quando: <b>${fdd(r.data)}<\/b><\/span>\n          <span>Pessoas: <b>${r.pred_p50_andar} de ${r.capacidade}<\/b><\/span>\n          <span>${projTxt}<\/span>\n        <\/div>\n      <\/div>\n      <div class=\"dside\">\n        <div class=\"dactions\">\n          <button class=\"dbtn pri\" onclick=\"event.stopPropagation();openModal('${r.floor_id}','${r.data}')\">Abrir andar<\/button>\n          <button class=\"dbtn\" onclick=\"event.stopPropagation();goToBuildingFloor('${r.building_id}','${String(r.andar).replace(/'/g,'')}')\">Ver prédio em 3D<\/button>\n        <\/div>\n        <span class=\"dexp\">evidência<\/span>\n      <\/div>\n    <\/div>\n    <div class=\"devi\"><div class=\"devi-in\">\n      <div>\n        <h5>Evolução<\/h5>\n        <div class=\"xrows\">\n          ${xrowHTML(fdd(e.prev.data),'ocupação anterior',null,e.from)}\n          ${xrowHTML(fdd(r.data),'nova ocupação',e.from,e.to)}\n        <\/div>\n      <\/div>\n      <div>\n        <h5>Por que merece atenção<\/h5>\n        <p>Elevação de ${rnd1(e.delta)}pp entre dias consecutivos — muito acima da variação típica. ${projTxt} ${cf.desc}<\/p>\n        <p style=\"margin-top:10px\"><b style=\"color:var(--tx-main);font-weight:600\">Próximo passo:<\/b> preparar redistribuição preventiva e reforço operacional antes de ${fdd(r.data)}.<\/p>\n      <\/div>\n    <\/div><\/div>\n  <\/div>`;\n}\nfunction emCardHTML(e){\n  const r=e.rec,tier=occKey(e.to),cf=INTEL.confidence(r);\n  const projTxt=emProjTxt(e);\n  const next=e.already?'Tratar como crítico: ver redistribuição nas decisões prioritárias.':'Preparar redistribuição preventiva e reforço operacional antes da data.';\n  return `<div class=\"em-card sev-${e.sev}\" onclick=\"openModal('${r.floor_id}','${r.data}')\">\n    <div class=\"em-top\"><div class=\"em-place\">${r.building_short} · ${andarLbl(r.andar)}<\/div><div class=\"em-days\">${e.prev?`${fdia(e.prev.data)} → ${fdia(r.data)}`:fdd(r.data)}<\/div><\/div>\n    <div class=\"em-jump\">\n      ${e.from!=null?`<span class=\"em-from\">${rnd1(e.from)}%<\/span><span class=\"em-arrow\">→<\/span>`:''}\n      <span class=\"em-to\" style=\"color:var(--${tier})\">${rnd1(e.to)}%<\/span>\n      ${e.delta!=null?`<span class=\"chip ${e.sev} em-delta\">+${rnd1(e.delta)}pp<\/span>`:'<span class=\"chip amb em-delta\">perto do limite<\/span>'}\n    <\/div>\n    <div class=\"em-why\">${projTxt} <span class=\"conf ${cf.cls}\" title=\"${cf.desc}\" style=\"vertical-align:1px\"><i><\/i>${cf.label}<\/span><\/div>\n    <div class=\"em-next\"><b>Próximo passo:<\/b> ${next}<\/div>\n  <\/div>`;\n}\n\n/* ===== Planejador de Janelas Operacionais (v3) ===== */\nconst WIN_TYPES=[\n  {id:'manut',label:'Manutenção preventiva',scope:'building'},\n  {id:'infra',label:'Infraestrutura',scope:'building'},\n  {id:'elev',label:'Teste de elevadores',scope:'building'},\n  {id:'fecho',label:'Fechamento parcial de andar',scope:'floor'},\n  {id:'limp',label:'Limpeza profunda',scope:'floor'},\n  {id:'mov',label:'Movimentação interna',scope:'floor'},\n  {id:'evento',label:'Evento corporativo',scope:'floor'}\n];\nconst RANKLBL=['Melhor recomendação','Alternativa segura','Alternativa secundária'];\nfunction normArr(vals){const mn=Math.min(...vals),mx=Math.max(...vals);return v=>mx>mn?(v-mn)/(mx-mn):0.5;}\nfunction capPer(list,keyFn,maxEach,total){\n  const cnt={},out=[];\n  for(const it of list){const k=keyFn(it);cnt[k]=(cnt[k]||0)+1;if(cnt[k]<=maxEach)out.push(it);if(out.length>=total)break;}\n  return out;\n}\nINTEL.bdFloors=function(){return this.memo('bdfloors',()=>{\n  const m=new Map();\n  APICE_DATA.forEach(r=>{const k=r.building_id+'|'+r.data;if(!m.has(k))m.set(k,[]);m.get(k).push(r);});\n  return m;});};\nINTEL.planner=function(type){return this.memo('plan3_'+type,()=>{\n  const bf=this.bdFloors();\n  if(type==='manut'||type==='infra'||type==='elev'){\n    let cands=this.buildingDays().map(x=>({...x,maxOcc:Math.max(0,...(bf.get(x.bid+'|'+x.date)||[]).map(r=>r.occupancy_pct_andar))})).filter(x=>x.crit===0);\n    if(type==='infra')cands=cands.filter(x=>x.occ90<=60);\n    if(!cands.length)return [];\n    const nOcc=normArr(cands.map(c=>c.occ)),nOcc90=normArr(cands.map(c=>c.occ90)),nFree=normArr(cands.map(c=>c.free)),nSpr=normArr(cands.map(c=>c.spread)),nMax=normArr(cands.map(c=>c.maxOcc)),nP=normArr(cands.map(c=>c.p50));\n    cands.forEach(c=>{\n      if(type==='manut')c.score=Math.round(100*(0.45*(1-nOcc(c.occ))+0.25*(1-nOcc90(c.occ90))+0.20*nFree(c.free)+0.10*(1-nSpr(c.spread))));\n      else if(type==='infra')c.score=Math.round(100*(0.35*(1-nOcc(c.occ))+0.35*(1-nOcc90(c.occ90))+0.20*nFree(c.free)+0.10*(1-nSpr(c.spread))));\n      else c.score=Math.round(100*(0.40*(1-nP(c.p50))+0.30*(1-nMax(c.maxOcc))+0.30*(1-nOcc(c.occ))));\n      c.restr=[];\n      if(c.att)c.restr.push(`${c.att} andar${c.att>1?'es':''} em atenção no dia`);\n      if(c.occ90>55)c.restr.push(`P90 de ${c.occ90}% — validar na véspera`);\n      if(type==='elev'&&c.maxOcc>80)c.restr.push(`andar mais cheio a ${rnd1(c.maxOcc)}%`);\n    });\n    return cands.sort((a,b)=>b.score-a.score);\n  }\n  if(type==='fecho'){\n    const cands=[];\n    bf.forEach(rows=>{\n      if(rows.length<2)return;\n      const totP50=rows.reduce((s,r)=>s+r.pred_p50_andar,0);\n      rows.forEach(r=>{\n        if(r.capacidade<=0)return;\n        const restCap=rows.reduce((s,x)=>s+(x===r?0:x.capacidade),0);\n        if(restCap<=0)return;\n        const afterRest=capPct(totP50,restCap);\n        const rest90=capPct(rows.reduce((s,x)=>s+(x===r?0:x.pred_p90_andar),0)+r.pred_p50_andar,restCap);\n        if(afterRest<=85)cands.push({rec:r,afterRest:rnd1(afterRest),beforeRest:rnd1(capPct(totP50-r.pred_p50_andar,restCap)),rest90:rnd1(rest90),people:r.pred_p50_andar});\n      });\n    });\n    if(!cands.length)return [];\n    const nA=normArr(cands.map(c=>c.afterRest)),nP=normArr(cands.map(c=>c.people));\n    cands.forEach(c=>{\n      c.score=Math.round(100*(0.65*(1-nA(c.afterRest))+0.35*(1-nP(c.people))));\n      c.restr=[];\n      if(c.rest90>90)c.restr.push(`no P90, os demais andares chegam a ${c.rest90}%`);\n    });\n    return cands.sort((a,b)=>b.score-a.score);\n  }\n  let cands=APICE_DATA.filter(r=>r.capacidade>0).map(r=>({rec:r,occ:r.occupancy_pct_andar,occ90:rnd1(capPct(r.pred_p90_andar,r.capacidade)),free:Math.max(0,r.capacidade-r.pred_p50_andar),free90:Math.max(0,r.capacidade-r.pred_p90_andar),spread:rnd1(capPct(r.pred_p90_andar-r.pred_p10_andar,r.capacidade)),vol:r.cluster_nome==='Volátil',bcrit:(bf.get(r.building_id+'|'+r.data)||[]).filter(x=>x.alerta_nivel==='CRITICO').length}));\n  if(type==='limp')cands=cands.filter(c=>c.occ90<=70);\n  if(type==='mov')cands=cands.filter(c=>c.occ<=60&&!c.vol);\n  if(type==='evento')cands=cands.filter(c=>c.occ<=65&&c.free90>=10&&c.bcrit===0);\n  if(!cands.length)return [];\n  const nOcc=normArr(cands.map(c=>c.occ)),nOcc90=normArr(cands.map(c=>c.occ90)),nFree=normArr(cands.map(c=>c.free)),nF90=normArr(cands.map(c=>c.free90)),nSpr=normArr(cands.map(c=>c.spread));\n  cands.forEach(c=>{\n    if(type==='limp')c.score=Math.round(100*(0.60*(1-nOcc(c.occ))+0.25*(1-nOcc90(c.occ90))+0.15*nFree(c.free)));\n    else if(type==='mov')c.score=Math.round(100*(0.50*nFree(c.free)+0.30*(1-nOcc(c.occ))+0.20*(1-nSpr(c.spread))));\n    else c.score=Math.round(100*(0.60*nF90(c.free90)+0.25*(1-nOcc(c.occ))+0.15*(1-nSpr(c.spread))));\n    c.restr=[];\n    if(c.vol)c.restr.push('padrão volátil — confirmar na véspera');\n    if(c.bcrit)c.restr.push(`${c.bcrit} ponto${c.bcrit>1?'s':''} crítico${c.bcrit>1?'s':''} no prédio no dia`);\n  });\n  return cands.sort((a,b)=>b.score-a.score);\n});};\nfunction setWinType(t){S.winType=t;renderStrategy();}\nfunction winWhy(w,type){\n  if(type==='manut')return `Menor ocupação do recorte, com ${w.free.toLocaleString('pt-BR')} posições livres. P90 de ${w.occ90}% mantém margem para a equipe em campo.`;\n  if(type==='infra')return `Mesmo no cenário máximo (P90 ${w.occ90}%) o prédio segue folgado — janela adequada para intervenção de infraestrutura.`;\n  if(type==='elev')return `Menor volume de pessoas (${w.p50.toLocaleString('pt-BR')}) e baixa concentração vertical (andar mais cheio: ${rnd1(w.maxOcc)}%) — impacto reduzido em paradas de elevador.`;\n  if(type==='fecho')return `Os demais andares absorvem 100% da demanda prevista: passam de ${w.beforeRest}% para ${w.afterRest}% (dentro do limite de 85%).`;\n  if(type==='limp')return `Menor movimento previsto (${w.occ}%) — interferência mínima para limpeza profunda ou vistoria.`;\n  if(type==='mov')return `${w.free.toLocaleString('pt-BR')} posições livres e padrão estável — espaço de manobra para realocações internas.`;\n  return `${w.free90.toLocaleString('pt-BR')} posições garantidas mesmo no cenário máximo e sem ponto crítico no prédio no dia.`;\n}\nfunction winCardV3(w,i,type){\n  const scopeB=type==='manut'||type==='infra'||type==='elev';\n  const r=scopeB?null:w.rec;\n  const click=scopeB?`goToBuilding('${w.bid}')`:`openModal('${r.floor_id}','${r.data}')`;\n  const place=scopeB?w.nome:`${r.building_short} · ${andarLbl(r.andar)}`;\n  const date=scopeB?w.date:r.data;\n  const stats=scopeB\n    ?`<div><b>${w.occ}%<\/b>P50<\/div><div><b>${w.occ90}%<\/b>P90<\/div><div><b>${w.free.toLocaleString('pt-BR')}<\/b>livres<\/div><div><b>${w.spread}pp<\/b>volatilidade<\/div>`\n    :type==='fecho'\n    ?`<div><b>${w.people}<\/b>pessoas a realocar<\/div><div><b>${w.beforeRest}% → ${w.afterRest}%<\/b>demais andares<\/div><div><b>${w.rest90}%<\/b>P90 restante<\/div>`\n    :`<div><b>${w.occ}%<\/b>P50<\/div><div><b>${w.occ90}%<\/b>P90<\/div><div><b>${(type==='evento'?w.free90:w.free).toLocaleString('pt-BR')}<\/b>${type==='evento'?'garantidas':'livres'}<\/div><div><b>${w.spread}pp<\/b>volatilidade<\/div>`;\n  return `<div class=\"win-card\" onclick=\"${click}\">\n    <div style=\"display:flex;justify-content:space-between;align-items:flex-start;gap:8px\">\n      <span class=\"win-ranklbl ${i?'alt':''}\">${RANKLBL[i]||(i+1)+'º'}<\/span>\n      <span class=\"pl-score\">${w.score}<span>/100<\/span><\/span>\n    <\/div>\n    <div class=\"win-day\">${fdd(date)}<\/div>\n    <div class=\"win-place\">${place}<\/div>\n    <div class=\"win-stats\">${stats}<\/div>\n    <div class=\"win-why\">${winWhy(w,type)}<\/div>\n    ${w.restr&&w.restr.length?`<div class=\"win-restr\">Restrições: ${w.restr.join('; ')}.<\/div>`:''}\n    ${r?winHierLine(r):''}\n  <\/div>`;\n}\n\n/* IDEIA AUTORAL V4: \"Margem de Resiliência\" — teste de estresse do portfólio.\n   Aplica choques de +1% a +25% sobre a previsão central (P50 e P90 escalados) e reexecuta a\n   busca de destinos seguros para responder: quanto a demanda pode crescer antes de o portfólio\n   deixar de se auto-absorver? Entrega o ponto de ruptura, os novos críticos de cada choque e a\n   curva de absorção. Substitui a \"Sincronia de Picos\" da v3. Derivada 100% do JSON. */\nINTEL.stress=function(shockPct){return this.memo('stress_'+shockPct,()=>{\n  const f=1+shockPct/100;\n  const T={origem:.85,dest50:.80,dest90:.95,min:5};\n  let crit=0,excessTot=0,movedTot=0;\n  const worstByDate=new Map();\n  const newCritMap=new Map();\n  const byDate=new Map();\n  APICE_DATA.forEach(r=>{if(!byDate.has(r.data))byDate.set(r.data,[]);byDate.get(r.data).push(r);});\n  byDate.forEach((rows,date)=>{\n    const scaled=rows.filter(r=>r.capacidade>0).map(r=>({r,p50:r.pred_p50_andar*f,p90:r.pred_p90_andar*f,cap:r.capacidade}));\n    const origins=scaled.filter(x=>x.p50/x.cap>=0.9).sort((a,b)=>b.p50/b.cap-a.p50/a.cap);\n    crit+=origins.length;\n    origins.forEach(o=>{\n      if(o.r.occupancy_pct_andar<90){\n        const occ=rnd1(o.p50/o.cap*100);\n        const prev=newCritMap.get(o.r.floor_id);\n        if(!prev||occ>prev.occ)newCritMap.set(o.r.floor_id,{rec:o.r,date,occ});\n      }\n    });\n    const rooms=new Map();\n    scaled.forEach(x=>rooms.set(x.r.floor_id,Math.max(0,Math.min(Math.floor(x.cap*T.dest50)-Math.round(x.p50),Math.floor(x.cap*T.dest90)-Math.round(x.p90)))));\n    let residDate=0;\n    origins.forEach(o=>{\n      let ex=Math.round(o.p50)-Math.floor(o.cap*T.origem);\n      if(ex<T.min)return;\n      excessTot+=ex;\n      const cands=scaled.filter(x=>x.r.floor_id!==o.r.floor_id&&(rooms.get(x.r.floor_id)||0)>=T.min)\n        .sort((a,b)=>(((b.r.building_id===o.r.building_id)?1:0)-((a.r.building_id===o.r.building_id)?1:0))||((rooms.get(b.r.floor_id)||0)-(rooms.get(a.r.floor_id)||0)));\n      for(const c of cands){\n        if(ex<=0)break;\n        const room=rooms.get(c.r.floor_id)||0;\n        const q=Math.min(room,ex);\n        if(q>=T.min||q===ex){rooms.set(c.r.floor_id,room-q);ex-=q;movedTot+=q;}\n      }\n      residDate+=Math.max(0,ex);\n    });\n    if(residDate>0)worstByDate.set(date,residDate);\n  });\n  const residual=Math.max(0,excessTot-movedTot);\n  let worst={date:null,resid:0};\n  worstByDate.forEach((v,d)=>{if(v>worst.resid)worst={date:d,resid:v};});\n  return{shock:shockPct,crit,excess:excessTot,moved:movedTot,residual,\n    absorb:excessTot?Math.round(movedTot/excessTot*100):100,worst,\n    newCrit:[...newCritMap.values()].sort((a,b)=>b.occ-a.occ)};\n});};\nINTEL.resilience=function(){return this.memo('resil',()=>{\n  const pts=[];let rupture=null;\n  for(let s=0;s<=25;s++){\n    const st=this.stress(s);\n    pts.push({s,absorb:st.absorb,residual:st.residual});\n    if(rupture==null&&st.residual>0)rupture=s;\n  }\n  return{pts,rupture};\n});};\nfunction setStressPct(v){S.stressPct=v;renderStrategy();}\nfunction stressCurveSVG(res,sel){\n  const W=560,H=210,L=38,R=12,T=14,B=28;\n  const pw=W-L-R,ph=H-T-B;\n  const X=s=>L+s/25*pw;\n  const Y=a=>T+(100-a)/100*ph;\n  const pts=res.pts.map(p=>`${X(p.s).toFixed(1)},${Y(p.absorb).toFixed(1)}`).join(' ');\n  const area=`M${X(0).toFixed(1)},${Y(res.pts[0].absorb).toFixed(1)} L${pts.split(' ').slice(1).map(p=>'L'+p).join(' ').slice(1)} L${X(25).toFixed(1)},${(T+ph).toFixed(1)} L${X(0).toFixed(1)},${(T+ph).toFixed(1)} Z`;\n  const selP=res.pts[Math.max(0,Math.min(25,sel))];\n  const grid=[100,75,50].map(v=>`<line x1=\"${L}\" y1=\"${Y(v)}\" x2=\"${W-R}\" y2=\"${Y(v)}\" stroke=\"rgba(31,31,31,.07)\" stroke-width=\"1\"/><text x=\"${L-6}\" y=\"${Y(v)+3}\" text-anchor=\"end\" font-size=\"9\" fill=\"#9AA0A6\" font-family=\"Inter,sans-serif\">${v}%<\/text>`).join('');\n  const xlbl=[0,5,10,15,20,25].map(v=>`<text x=\"${X(v)}\" y=\"${H-8}\" text-anchor=\"middle\" font-size=\"9\" fill=\"#9AA0A6\" font-family=\"Inter,sans-serif\">${v?'+'+v+'%':'0%'}<\/text>`).join('');\n  const rup=res.rupture!=null?`<line x1=\"${X(res.rupture)}\" y1=\"${T-2}\" x2=\"${X(res.rupture)}\" y2=\"${T+ph}\" stroke=\"#D93025\" stroke-width=\"1.4\" stroke-dasharray=\"4 4\"/><text x=\"${X(res.rupture)+5}\" y=\"${T+9}\" font-size=\"10\" font-weight=\"700\" fill=\"#D93025\" font-family=\"Inter,sans-serif\">ruptura +${res.rupture}%<\/text>`:'';\n  return `<svg viewBox=\"0 0 ${W} ${H}\" style=\"width:100%;height:auto;display:block\">\n    ${grid}${xlbl}\n    <path d=\"${area}\" fill=\"rgba(0,184,241,.10)\"/>\n    <polyline points=\"${pts}\" fill=\"none\" stroke=\"#00B8F1\" stroke-width=\"2.5\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\n    ${rup}\n    <circle cx=\"${X(selP.s)}\" cy=\"${Y(selP.absorb)}\" r=\"4.5\" fill=\"#fff\" stroke=\"#00B8F1\" stroke-width=\"3\"/>\n  <\/svg>`;\n}\nfunction resilienceModuleHTML(){\n  const badge=``;\n  if(!APICE_DATA.length||!FORECAST_DATES.length)return '';\n  const res=INTEL.resilience();\n  const sel=[5,10,15,20,25].includes(S.stressPct)?S.stressPct:10;\n  const st=INTEL.stress(sel);\n  const base=INTEL.stress(0);\n  let v;\n  if(res.rupture==null)v={dot:'var(--grn)',b:'Portfólio resiliente.',t:`Mesmo com +25% de demanda sobre a previsão central (limite testado), todo o excesso encontra destino seguro dentro do portfólio. Há margem confortável para crescimento e imprevistos.`};\n  else if(res.rupture===0)v={dot:'var(--red)',b:'Sem capacidade disponível para absorver aumentos.',t:`Já no cenário atual, ${base.residual.toLocaleString('pt-BR')} pessoa${base.residual!==1?'s':''} fica${base.residual!==1?'m':''} sem destino seguro. Priorizar as redistribuições recomendadas e revisar a capacidade antes de absorver qualquer crescimento.`};\n  else v={dot:'var(--amb)',b:`O portfólio absorve choques de demanda até +${res.rupture-1}%.`,t:`A partir de +${res.rupture}%, ${INTEL.stress(res.rupture).residual.toLocaleString('pt-BR')} pessoa${INTEL.stress(res.rupture).residual!==1?'s':''} fica${INTEL.stress(res.rupture).residual!==1?'m':''} sem destino seguro${INTEL.stress(res.rupture).worst.date?` (pior dia: ${fdd(INTEL.stress(res.rupture).worst.date)})`:''}. Use +${res.rupture}% como gatilho de contingência: acima disso, o portfólio deixa de se auto-absorver.`};\n  return `<section class=\"card sync-card\" id=\"sec-autoral\" style=\"padding:30px 34px\">\n    <div style=\"display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap\">\n      <div>\n        ${badge}\n        <div class=\"chart-title\" style=\"margin-top:12px\">Capacidade para absorver aumento de ocupação<\/div>\n        <div class=\"chart-sub\" style=\"max-width:660px\">Teste de estresse do portfólio: o ÁPICE aplica choques de demanda sobre a previsão central e reexecuta a busca de destinos seguros. A curva mostra quanto do excesso ainda é absorvível — e onde fica o ponto de ruptura · portfólio completo.<\/div>\n      <\/div>\n      <span class=\"mini-badge\">Ruptura <strong style=\"color:var(--${res.rupture==null?'grn':res.rupture===0?'red':'org'})\">${res.rupture==null?'> +25%':res.rupture===0?'atual':'+'+res.rupture+'%'}<\/strong><\/span>\n    <\/div>\n    <div class=\"vband\" style=\"margin-top:16px\"><i style=\"background:${v.dot}\"><\/i><span><b>${v.b}<\/b> ${v.t}<\/span><\/div>\n    <div class=\"sync-grid\">\n      <div>\n        <div style=\"display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap\">\n          <span style=\"font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--tx-mut)\">Excesso absorvível × choque de demanda<\/span>\n          <div style=\"display:flex;gap:6px;flex-wrap:wrap\">${[5,10,15,20,25].map(x=>`<button class=\"bchip ${sel===x?'on':''}\" style=\"padding:5px 12px;font-size:12px\" onclick=\"setStressPct(${x})\">+${x}%<\/button>`).join('')}<\/div>\n        <\/div>\n        ${stressCurveSVG(res,sel)}\n      <\/div>\n      <div class=\"sync-detail\">\n        <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px;flex-wrap:wrap\">\n          <div style=\"font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:500;white-space:nowrap\">Com demanda +${sel}%<\/div>\n          <div style=\"font-size:11px;color:var(--tx-mut)\">vs. cenário atual<\/div>\n        <\/div>\n        <div class=\"r3d-kv\" style=\"margin:0 0 12px\">\n          <div class=\"r3d-k\"><span>Alertas críticos<\/span><b style=\"white-space:nowrap\">${base.crit} → <span style=\"color:var(--${st.crit>base.crit?'red':'tx-main'})\">${st.crit}<\/span><\/b><\/div>\n          <div class=\"r3d-k\"><span>Excesso a tratar<\/span><b>${st.excess.toLocaleString('pt-BR')}<\/b><\/div>\n          <div class=\"r3d-k\"><span>Absorção segura<\/span><b style=\"color:var(--${st.absorb>=100?'grn':st.absorb>=70?'amb':'red'})\">${st.absorb}%<\/b><\/div>\n          <div class=\"r3d-k\"><span>Sem destino<\/span><b style=\"color:var(--${st.residual?'red':'grn'})\">${st.residual.toLocaleString('pt-BR')}<\/b><\/div>\n        <\/div>\n        ${st.worst.date?`<div style=\"font-size:11.5px;color:var(--tx-sec);margin-bottom:10px\">Pior dia neste choque: <b style=\"color:var(--tx-main)\">${fdd(st.worst.date)}<\/b> — ${st.worst.resid.toLocaleString('pt-BR')} pessoa${st.worst.resid!==1?'s':''} sem destino.<\/div>`:''}\n        <div style=\"font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--tx-mut);margin:12px 0 6px\">Primeiros a romper<\/div>\n        ${st.newCrit.length?st.newCrit.slice(0,3).map(n=>`<div class=\"sync-brow\" onclick=\"openModal('${n.rec.floor_id}','${n.date}')\"><b>${n.rec.building_short} · ${andarLbl(n.rec.andar)}<\/b><span style=\"color:var(--red)\">${n.occ}%<\/span><span style=\"color:var(--tx-sec)\">${fdia(n.date)}<\/span><\/div>`).join('')\n        :`<div style=\"font-size:12px;color:var(--tx-sec)\">Nenhum novo andar entra em criticidade com +${sel}%.<\/div>`}\n        <div style=\"font-size:10.5px;color:var(--tx-mut);margin-top:12px;line-height:1.5\">Estimativa agregada: P50 e P90 escalados pelo choque; mesmos limites de segurança das redistribuições (origem ≤85%, destino ≤80% P50 e ≤95% P90).<\/div>\n      <\/div>\n    <\/div>\n  <\/section>`;\n}\n\n/* Navegação do radar */\nfunction focusSection(id){\n  const el=document.getElementById(id);if(!el)return;\n  const r=el.getBoundingClientRect();\n  window.scrollTo({top:window.scrollY+r.top-165,behavior:'smooth'});\n  el.classList.remove('flash');void el.offsetWidth;\n  el.classList.add('flash');\n  setTimeout(()=>el.classList.remove('flash'),1400);\n}\n\nfunction renderStrategy(){\n  const dateF=S.filters.date,bldF=S.filters.building;\n  const inScope=r=>(!dateF||sameValue(r.data,dateF))&&(!bldF||sameValue(r.building_id,bldF));\n  const allPlans=INTEL.plans();\n  const plans=allPlans.filter(p=>inScope(p.origin));\n  const emerging=INTEL.emerging().filter(e=>!e.already&&inScope(e.rec));\n  const conc=INTEL.concentration();\n  const inact=INTEL.inaction();\n  const confS=INTEL.confSummary();\n  const totExcess=allPlans.reduce((s,p)=>s+p.excess,0);\n  const totMoved=allPlans.reduce((s,p)=>s+p.moved,0);\n  const absorbAll=totExcess?Math.round(totMoved/totExcess*100):0;\n  const scopeB=w=>(!bldF||sameValue(w.bid,bldF))&&(!dateF||sameValue(w.date,dateF));\n  const manutAll=INTEL.planner('manut').filter(scopeB);\n  const winTop=manutAll[0];\n  const plRaw=INTEL.planner(S.winType);\n  const isB=S.winType==='manut'||S.winType==='infra'||S.winType==='elev';\n  const plScoped=isB?plRaw.filter(scopeB):plRaw.filter(w=>inScope(w.rec));\n  const wins=capPer(plScoped,w=>isB?w.bid:w.rec.floor_id,2,3);\n  const typeLbl=(WIN_TYPES.find(t=>t.id===S.winType)||{}).label||'';\n  const repByFloor={};plans.forEach(p=>{repByFloor[p.origin.floor_id]=(repByFloor[p.origin.floor_id]||0)+1;});\n  const seenPF=new Set();\n  const plansU=plans.filter(p=>{if(seenPF.has(p.origin.floor_id))return false;seenPF.add(p.origin.floor_id);return true;});\n  const cards=plansU.slice(0,4).map(p=>dcardPlan(p,repByFloor[p.origin.floor_id]));\n  if(!cards.length)emerging.slice(0,2).forEach((e,i)=>cards.push(dcardEmerging(e,i)));\n  const emTop=emerging[0];\n  const t2=Math.round(conc.top2*100),t3=Math.round(conc.top3*100);\n  const concNames=conc.arr.length?(conc.arr[1]?`${conc.arr[0].short} e ${conc.arr[1].short}`:conc.arr[0].short):'';\n  const concLeitura=conc.verdict==='alta'?'risco localizado':conc.verdict==='media'?'parcialmente localizado':'risco distribuído';\n  const vb=conc.arr.length?{alta:{dot:'var(--red)',b:'Risco altamente concentrado.'},media:{dot:'var(--amb)',b:'Risco moderadamente concentrado.'},baixa:{dot:'var(--blu)',b:'Risco distribuído.'}}[conc.verdict]:null;\n  const filterNote=(dateF||bldF)?`<div style=\"font-size:12px;color:var(--tx-mut);margin:-28px 0 32px\">Escopo: ${bldF?(BUILDINGS_CONFIG.find(b=>b.id===bldF)?.nome||bldF):'todos os prédios'}${dateF?` · ${fdd(dateF)}`:''} — destinos de redistribuição, concentração e capacidade para absorver aumentos consideram o portfólio completo.<\/div>`:'';\n\n  document.getElementById('panel-strategy').innerHTML=`\n  <div style=\"margin-bottom:36px;\">\n    <h1 class=\"sec-title\">Central de Decisão<\/h1>\n    <p class=\"sec-desc\" style=\"margin-bottom:8px\">Veja o que precisa de atenção, onde a ocupação está aumentando, quais ações são recomendadas e quando agir. Atualizado automaticamente com os dados mais recentes.<\/p>\n  <\/div>\n  ${filterNote}\n  <div class=\"g4\" style=\"margin-bottom:16px\">\n    <div class=\"metric-card red\">\n      <div class=\"metric-lbl\">Impacto de não agir<\/div>\n      <div class=\"metric-val\" style=\"color:var(--${inact.tot?'red':'grn'})\">${inact.tot.toLocaleString('pt-BR')}<\/div>\n      <div class=\"metric-sub\">pessoa-dias acima da capacidade na semana${inact.tot?` · ${inact.floors} andar${inact.floors!==1?'es':''} em ${inact.days} dia${inact.days!==1?'s':''}`:''}<\/div>\n      <div class=\"metric-trend ${inact.tot?'up':'down'}\" style=\"white-space:nowrap\">${inact.tot?(inact.after===0?'ações recomendadas zeram o excesso':`após ações: ${inact.after.toLocaleString('pt-BR')}`):'sem excesso de capacidade'}<\/div>\n    <\/div>\n    <div class=\"metric-card org\">\n      <div class=\"metric-lbl\">Redistribuível com segurança<\/div>\n      <div class=\"metric-val\" style=\"color:var(--org)\">${totExcess?absorbAll+'%':'--'}<\/div>\n      <div class=\"metric-sub\">${totExcess?`${totMoved.toLocaleString('pt-BR')} de ${totExcess.toLocaleString('pt-BR')} pessoas em excesso encontram destino seguro`:'nenhuma pressão a redistribuir'}<\/div>\n      <div class=\"metric-trend info\">${allPlans.length} plano${allPlans.length!==1?'s':''}<\/div>\n    <\/div>\n    <div class=\"metric-card amb\">\n      <div class=\"metric-lbl\">Críticos confirmados<\/div>\n      <div class=\"metric-val\" style=\"color:var(--amb)\">${confS.c1}<span style=\"font-size:20px;color:var(--tx-mut)\">/${confS.total}<\/span><\/div>\n      <div class=\"metric-sub\">alertas críticos mesmo no cenário mínimo (P10)<\/div>\n      <div class=\"metric-trend info\">${confS.c2} prováveis · ${confS.c3} possíveis<\/div>\n    <\/div>\n    <div class=\"metric-card grn\">\n      <div class=\"metric-lbl\">Melhor janela<\/div>\n      <div class=\"metric-val\" style=\"color:var(--grn)\">${winTop?fdia(winTop.date)||fd(winTop.date):'--'}<\/div>\n      <div class=\"metric-sub\">${winTop?`${winTop.short} · ${winTop.occ}% previsto · ${winTop.free.toLocaleString('pt-BR')} posições livres`:'sem janela identificada no recorte'}<\/div>\n      <div class=\"metric-trend down\">para intervenções<\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"radar\">\n    <button class=\"rtile\" onclick=\"focusSection('sec-riscos')\">\n      <div class=\"rtile-k\"><i style=\"background:var(--amb)\"><\/i>Riscos em formação<\/div>\n      <div class=\"rtile-main\">${emerging.length?`${emerging.length} risco${emerging.length>1?'s':''} em formação`:'Nenhum risco em formação'}<\/div>\n      <div class=\"rtile-sub\">${emTop?`Maior salto: +${rnd1(emTop.delta??0)}pp · ${emTop.rec.building_short} · ${andarLbl(emTop.rec.andar)}`:'Sem elevações abruptas no recorte'}<\/div>\n      <span class=\"rtile-cta\">Ver riscos<\/span>\n    <\/button>\n    <button class=\"rtile\" onclick=\"focusSection('sec-conc')\">\n      <div class=\"rtile-k\"><i style=\"background:var(--red)\"><\/i>Onde está o risco<\/div>\n      <div class=\"rtile-main\">${conc.arr.length?`${t2}% em ${conc.arr.length>1?'2 prédios':'1 prédio'}`:'Sem criticidade'}<\/div>\n      <div class=\"rtile-sub\">${conc.arr.length?`Principal: ${conc.arr[0].short} · leitura: ${concLeitura}`:'Nenhum alerta crítico ou de atenção'}<\/div>\n      <span class=\"rtile-cta\">Ver concentração<\/span>\n    <\/button>\n    <button class=\"rtile\" onclick=\"focusSection('sec-janelas')\">\n      <div class=\"rtile-k\"><i style=\"background:var(--grn)\"><\/i>Janelas operacionais<\/div>\n      <div class=\"rtile-main\">${manutAll.length?`${manutAll.length} janela${manutAll.length>1?'s':''} segura${manutAll.length>1?'s':''}`:'Sem janelas seguras'}<\/div>\n      <div class=\"rtile-sub\">${winTop?`Melhor: ${winTop.short} · ${fdia(winTop.date)} · P90 ${winTop.occ90}%`:'Nenhum período sem risco no recorte'}<\/div>\n      <span class=\"rtile-cta\">Planejar intervenção<\/span>\n    <\/button>\n    <button class=\"rtile\" onclick=\"focusSection('sec-planos')\">\n      <div class=\"rtile-k\"><i style=\"background:var(--org)\"><\/i>Redistribuições<\/div>\n      <div class=\"rtile-main\">${plans.length?`${plans.length} plano${plans.length>1?'s':''} recomendado${plans.length>1?'s':''}`:'Nada a redistribuir'}<\/div>\n      <div class=\"rtile-sub\">${plans.length?`${plans.reduce((s,p)=>s+p.moved,0).toLocaleString('pt-BR')} pessoas realocáveis · ${absorbAll}% do excesso absorvível`:'Sem saturação crítica no recorte'}<\/div>\n      <span class=\"rtile-cta\">Ver planos<\/span>\n    <\/button>${hierRadarTile()}\n  <\/div>\n\n  <div class=\"dgrid\">\n    <section id=\"sec-planos\" style=\"border-radius:24px\">\n      <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:14px;margin-bottom:14px\">\n        <h2 class=\"sec-title\" style=\"font-size:22px;margin-bottom:0\">Decisões prioritárias<\/h2>\n        <span style=\"font-size:12px;color:var(--tx-mut)\">${cards.length} açõe${cards.length===1?'':'s'} · clique para ver a evidência<\/span>\n      <\/div>\n      <div class=\"dlist\">\n        ${cards.join('')||`<div class=\"card\" style=\"padding:26px 30px;font-size:13.5px;color:var(--tx-sec)\">Nenhuma decisão prioritária no recorte atual — sem saturações críticas nem elevações abruptas.${dateF||bldF?' Limpe os filtros para a leitura completa do portfólio.':''}<\/div>`}\n      <\/div>\n    <\/section>\n    <div class=\"rail\">\n      <section class=\"rail-card\" id=\"sec-riscos\" style=\"border-radius:22px\">\n        <div class=\"rail-hd\"><div class=\"rail-title\">Riscos em Formação<\/div><div class=\"rail-sub\">${emerging.length} caso${emerging.length!==1?'s':''}<\/div><\/div>\n        <div class=\"rail-sub\" style=\"margin-bottom:6px\">Saltos dia a dia e aproximações do limite crítico<\/div>\n        ${emerging.length?`<div class=\"rk-list\">${emerging.slice(0,5).map((e,i)=>{\n          const r=e.rec,cf=INTEL.confidence(r);\n          const gap=e.to<90?`a ${rnd1(90-e.to)}pp do crítico`:'no limite crítico';\n          const projS=e.projKind==='data'?` · criticidade ${fdia(e.proj)}`:e.projKind==='trend'?' · tendência além do horizonte':e.type==='salto'?' · dias seguintes recuam':'';\n          return `<div class=\"rk-row\" onclick=\"openModal('${r.floor_id}','${r.data}')\">\n            <div class=\"rk-rank ${e.sev==='red'?'red':''}\">${i+1}<\/div>\n            <div class=\"rk-main\">\n              <div class=\"rk-place\">${r.building_short} · ${andarLbl(r.andar)} <span class=\"conf ${cf.cls}\" title=\"${cf.desc}\"><i><\/i>${cf.label}<\/span><\/div>\n              <div class=\"xbar rk-bar\">\n                <div class=\"xth\" style=\"left:80%\"><\/div><div class=\"xth\" style=\"left:90%\"><\/div>\n                <div class=\"xfill\" style=\"width:${Math.min(100,e.to)}%;background:var(--${occKey(e.to)})\"><\/div>\n                ${e.from!=null?`<div class=\"xwas\" style=\"left:${Math.min(100,e.from)}%\"><\/div>`:''}\n              <\/div>\n              <div class=\"rk-note\">${gap}${projS}<\/div>\n            <\/div>\n            <div class=\"rk-delta\"><b style=\"color:var(--${e.sev})\">${e.delta!=null?`+${rnd1(e.delta)}pp`:`${rnd1(e.to)}%`}<\/b><span>${e.from!=null?`${rnd1(e.from)} → ${rnd1(e.to)}%`:fdia(r.data)}<\/span><\/div>\n          <\/div>`;}).join('')}<\/div>`\n        :'<p style=\"font-size:12.5px;color:var(--tx-sec);padding:10px 0 4px;line-height:1.6\">Nenhuma elevação abrupta ou aproximação de limite no recorte atual.<\/p>'}\n      <\/section>\n      <section class=\"rail-card\" id=\"sec-conc\" style=\"border-radius:22px\">\n        <div class=\"rail-hd\"><div class=\"rail-title\">Onde o risco está<\/div><div class=\"rail-sub\">portfólio completo<\/div><\/div>\n        ${conc.arr.length?`\n        <div class=\"vband\" style=\"margin:10px 0 14px\"><i style=\"background:${vb.dot}\"><\/i><span><b>${vb.b}<\/b> ${t2}% d${conc.mode==='CRITICO'?'os alertas críticos':'os pontos de atenção'} em ${concNames} · Top 3: ${t3}%. ${conc.verdict==='alta'?`Priorizar um plano específico para ${concNames}.`:conc.verdict==='media'?'Combinar ação local nos líderes com monitoramento do restante.':'Avaliar medidas amplas de portfólio.'}<\/span><\/div>\n        <div class=\"par-list\" style=\"margin:0 0 12px\">\n          ${conc.arr.slice(0,4).map(b=>`<div class=\"par-row\" onclick=\"goToBuilding('${b.id}')\">\n            <div><div class=\"par-name\">${b.short}<\/div><div class=\"par-sub\">${b.n} alerta${b.n!==1?'s':''} · ${b.floors} andar${b.floors!==1?'es':''} · ${b.days} dia${b.days!==1?'s':''}<\/div><\/div>\n            <div class=\"par-track\" style=\"height:16px\"><div class=\"par-fill\" style=\"width:${Math.max(4,Math.round(b.share*100))}%\"><\/div><\/div>\n            <div class=\"par-share\" style=\"font-size:14px\">${Math.round(b.share*100)}%<\/div>\n            <div class=\"par-cum\">${Math.round(b.cum*100)}%<\/div>\n          <\/div>`).join('')}\n        <\/div>\n        <div style=\"font-size:11px;color:var(--tx-mut)\">${conc.total} alerta${conc.total!==1?'s':''} ${conc.mode==='CRITICO'?'críticos':'de atenção'} · clique em um prédio para investigar<\/div>`\n        :'<p style=\"font-size:12.5px;color:var(--tx-sec);padding:10px 0 4px;line-height:1.6\">Nenhum alerta crítico ou de atenção no período carregado.<\/p>'}\n      <\/section>\n    <\/div>\n  <\/div>\n\n  ${resilienceModuleHTML()}\n\n  <section class=\"card\" id=\"sec-janelas\" style=\"padding:30px 34px;margin-bottom:26px\">\n    <div class=\"chart-head\"><div>\n      <div class=\"chart-kicker\">planejador de janelas operacionais<\/div>\n      <div class=\"chart-title\">Quando agir sem impacto<\/div>\n      <div class=\"chart-sub\">Escolha o objetivo da intervenção — cada tipo pondera P50, P90, capacidade livre, volatilidade e absorção de forma diferente<\/div>\n    <\/div><\/div>\n    <div class=\"win-types\">\n      ${WIN_TYPES.map(t=>`<button class=\"bchip ${S.winType===t.id?'on':''}\" onclick=\"setWinType('${t.id}')\">${t.label}<\/button>`).join('')}\n    <\/div>\n    ${wins.length?`<div class=\"win-grid\">${wins.map((w,i)=>winCardV3(w,i,S.winType)).join('')}<\/div>`\n    :`<p style=\"font-size:13px;color:var(--tx-sec)\">Nenhuma janela segura foi encontrada para <b>${typeLbl.toLowerCase()}<\/b> neste recorte — nenhum período atende aos critérios de segurança.<\/p>`}\n  <\/section>\n  <p style=\"font-size:11.5px;color:var(--tx-mut);line-height:1.7;max-width:920px\">Método: cenário central (P50) com verificação de segurança no máximo (P90). Limites: atenção ≥80%, crítico ≥90%. Redistribuições levam a origem para ≤85% e nunca deixam um destino acima de 80% (P50) ou 95% (P90). Confiança: <b>Confirmado<\/b> quando o mínimo (P10) já cruza o limite; <b>Provável<\/b> quando o central cruza; <b>Possível<\/b> quando apenas o máximo cruza. As recomendações e a capacidade para absorver aumentos são recalculadas a cada atualização dos dados.<\/p>`;\n}\n\n/* RENDER BUILDINGS — 3D interactive tower */\nconst FLOOR_STYLE={\n  red:{fill:0xD93025,fillOp:0.56,edge:0xFF6A5C,edgeOp:1,emissive:0xD93025,emI:0.95},\n  amb:{fill:0xE37400,fillOp:0.46,edge:0xFFB259,edgeOp:0.92,emissive:0xE37400,emI:0.62},\n  blu:{fill:0x1A73E8,fillOp:0.38,edge:0x6FA0F0,edgeOp:0.80,emissive:0x1A73E8,emI:0.30},\n  grn:{fill:0x21B24C,fillOp:0.34,edge:0x5BC07E,edgeOp:0.74,emissive:0x1E8E3E,emI:0.24}\n};\n// 3D color tiers — a touch more color: green(baixa) -> blue(moderada) -> amber(atenção) -> red(crítico)\nconst occKey=p=>p>=90?'red':p>=80?'amb':p>=50?'blu':'grn';\nfunction disposeTower(){\n  const t=S.three;if(!t)return;\n  if(t.raf)cancelAnimationFrame(t.raf);\n  if(t.onResize)window.removeEventListener('resize',t.onResize);\n  try{\n    if(t.renderer){t.renderer.dispose();const el=t.renderer.domElement;if(el&&el.parentNode)el.parentNode.removeChild(el);}\n  }catch(e){}\n  S.three=null;\n}\nfunction buildTower(container,floors,onHoverSync){\n  disposeTower();\n  const W=container.clientWidth||800,H=container.clientHeight||560;\n  const scene=new THREE.Scene();\n  const camera=new THREE.PerspectiveCamera(42,W/H,0.1,200);\n  const renderer=new THREE.WebGLRenderer({alpha:true,antialias:true,preserveDrawingBuffer:true});\n  renderer.setClearColor(0x000000,0);\n  renderer.setPixelRatio(Math.min(2,window.devicePixelRatio||1));\n  renderer.setSize(W,H);\n  if('sRGBEncoding' in THREE)renderer.outputEncoding=THREE.sRGBEncoding;\n  container.appendChild(renderer.domElement);\n\n  T3D.lights(scene);\n\n  const FW=2.7,FD=2.7,FH=0.30,GAP=0.06;\n  const n=floors.length,total=n*(FH+GAP);\n  const group=new THREE.Group();scene.add(group);\n  const meshes=[];\n  function makeLabel(text){\n    const cv=document.createElement('canvas');cv.width=160;cv.height=72;\n    const x=cv.getContext('2d');\n    x.font='600 44px Inter, Arial, sans-serif';x.textAlign='center';x.textBaseline='middle';\n    x.fillStyle='#ffffff';x.fillText(text,80,40);\n    const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(cv),transparent:true,opacity:0.42,depthWrite:false}));\n    sp.material.color.set(0x9AA0A6);sp.scale.set(0.86,0.39,1);return sp;\n  }\n  floors.forEach((f,i)=>{\n    const st=FLOOR_STYLE[f.c]||FLOOR_STYLE.grn;\n    const sc=0.80+Math.min(1,f.avg/100)*0.22;\n    const geo=new THREE.BoxGeometry(FW*sc,FH,FD*sc);\n    const mat=new THREE.MeshStandardMaterial({color:st.fill,transparent:true,opacity:st.fillOp,roughness:0.30,metalness:0.05,emissive:st.emissive,emissiveIntensity:st.emI});\n    const mesh=new THREE.Mesh(geo,mat);\n    mesh.position.y=i*(FH+GAP)+FH/2-total/2;\n    const edges=new THREE.LineSegments(new THREE.EdgesGeometry(geo),new THREE.LineBasicMaterial({color:st.edge,transparent:true,opacity:st.edgeOp}));\n    mesh.add(edges);\n    const label=makeLabel(f.andar);\n    label.position.set(FW*sc/2+0.62,mesh.position.y,0);\n    group.add(label);\n    mesh.userData={floor:f,base:{emI:st.emI,edgeOp:st.edgeOp,edges,mat},label,labelColor:st.edge};\n    group.add(mesh);meshes.push(mesh);\n  });\n  T3D.addBase(group,FW,total);\n\n  T3D.addShadow(group,FW,total);\n\n  const dist=Math.max(8,total*1.5+5);\n  camera.position.set(dist*0.62,total*0.18+1.2,dist*0.78);\n  const controls=new THREE.OrbitControls(camera,renderer.domElement);\n  controls.enableDamping=true;controls.dampingFactor=0.08;controls.enablePan=false;\n  controls.minDistance=5;controls.maxDistance=dist+8;controls.maxPolarAngle=Math.PI*0.92;\n  controls.target.set(0,0,0);\n  controls.autoRotate=true;controls.autoRotateSpeed=0.7;\n  let idleTimer=null;\n  controls.addEventListener('start',()=>{controls.autoRotate=false;if(idleTimer)clearTimeout(idleTimer);});\n  controls.addEventListener('end',()=>{if(idleTimer)clearTimeout(idleTimer);idleTimer=setTimeout(()=>{controls.autoRotate=true;},2500);});\n\n  const tip=document.getElementById('tower-tip');\n  const ray=new THREE.Raycaster(),ndc=new THREE.Vector2();\n  let hovered=null,downXY=null;\n  function emphasize(mesh,on){\n    if(!mesh)return;const b=mesh.userData.base;\n    b.mat.emissiveIntensity=on?Math.max(0.65,b.emI+0.55):b.emI;\n    b.edges.material.opacity=on?1:b.edgeOp;\n    mesh.scale.set(on?1.06:1,1,on?1.06:1);\n    const lb=mesh.userData.label;\n    if(lb){lb.material.opacity=on?1:0.42;lb.material.color.set(on?mesh.userData.labelColor:0x9AA0A6);lb.scale.set(on?1:0.86,on?0.45:0.39,1);}\n  }\n  function pick(ev){\n    const r=renderer.domElement.getBoundingClientRect();\n    ndc.x=((ev.clientX-r.left)/r.width)*2-1;\n    ndc.y=-((ev.clientY-r.top)/r.height)*2+1;\n    ray.setFromCamera(ndc,camera);\n    const hit=ray.intersectObjects(meshes,false)[0];\n    return hit?hit.object:null;\n  }\n  function onMove(ev){\n    const m=pick(ev);\n    if(m!==hovered){emphasize(hovered,false);hovered=m;emphasize(hovered,true);if(onHoverSync)onHoverSync(hovered?hovered.userData.floor.andar:null);}\n    renderer.domElement.style.cursor=hovered?'pointer':'grab';\n    if(hovered&&tip){\n      const f=hovered.userData.floor,r=container.getBoundingClientRect();\n      tip.style.display='block';\n      tip.style.left=Math.min(r.width-150,ev.clientX-r.left+14)+'px';\n      tip.style.top=(ev.clientY-r.top+14)+'px';\n      tip.innerHTML='<b>Andar '+f.andar+'<\/b><span style=\"color:var(--'+f.c+')\">'+f.avg.toFixed(1)+'%<\/span><em>'+f.base+' / '+f.cap+' lugares · clique para detalhes<\/em>';\n    }else if(tip)tip.style.display='none';\n  }\n  function onLeave(){emphasize(hovered,false);hovered=null;if(tip)tip.style.display='none';if(onHoverSync)onHoverSync(null);}\n  function onDown(ev){downXY=[ev.clientX,ev.clientY];}\n  function onUp(ev){\n    if(downXY){const dx=ev.clientX-downXY[0],dy=ev.clientY-downXY[1];if(Math.hypot(dx,dy)<5&&hovered){const f=hovered.userData.floor;openModal(f.rep.floor_id,f.rep.data);}}\n    downXY=null;\n  }\n  renderer.domElement.style.cursor='grab';\n  renderer.domElement.addEventListener('pointermove',onMove);\n  renderer.domElement.addEventListener('pointerleave',onLeave);\n  renderer.domElement.addEventListener('pointerdown',onDown);\n  renderer.domElement.addEventListener('pointerup',onUp);\n\n  function onResize(){const w=container.clientWidth,h=container.clientHeight;if(!w||!h)return;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h);}\n  window.addEventListener('resize',onResize);\n\n  const t={renderer,onResize,raf:null,meshes,\n    setEmphasis:(andar,on)=>{const m=meshes.find(mm=>mm.userData.floor.andar===andar);if(m){if(on)hovered=m;emphasize(m,on);if(!on&&hovered===m)hovered=null;}}};\n  S.three=t;\n  (function loop(){\n    const tt=performance.now()/1000;\n    for(const m of meshes){\n      if(m===hovered)continue;\n      const f=m.userData.floor,b=m.userData.base;\n      if(f.c==='red'||f.c==='amb'){\n        const amp=f.c==='red'?0.45:0.16,ph=0.5+0.5*Math.sin(tt*(f.c==='red'?2.4:1.6)+m.position.y*3);\n        b.mat.emissiveIntensity=b.emI+amp*ph;\n        b.edges.material.opacity=b.edgeOp+(f.c==='red'?0.05:0.03)*ph;\n      }\n    }\n    controls.update();renderer.render(scene,camera);t.raf=requestAnimationFrame(loop);\n  })();\n  return t;\n}\nfunction renderBuildings(){\n  const data=filtered();\n  const P=portfolioStats(data);\n  const byB={};\n  data.forEach(d=>{\n    if(!byB[d.building_id])byB[d.building_id]={id:d.building_id,nome:d.building_nome,short:d.building_short,floors:{}};\n    (byB[d.building_id].floors[d.andar]=byB[d.building_id].floors[d.andar]||[]).push(d);\n  });\n  const presentIds=Object.keys(byB);\n  let activeId=S.filters.building||S.viewBuilding;\n  if(!activeId||!byB[activeId])activeId=presentIds[0];\n  S.viewBuilding=activeId;\n  const active=activeId?byB[activeId]:null;\n\n  let fArr=[];\n  if(active){\n    fArr=Object.entries(active.floors).map(([andar,recs])=>{\n      const avg=recs.reduce((s,r)=>s+r.occupancy_pct_andar,0)/recs.length;\n      const bs=Math.round(recs.reduce((s,r)=>s+r.pred_p50_andar,0)/recs.length);\n      const cap=Math.round(recs.reduce((s,r)=>s+r.capacidade,0)/recs.length);\n      return{andar,avg,c:occKey(avg),rep:recs[0],base:bs,cap};\n    }).sort((a,b)=>a.andar.localeCompare(b.andar));\n  }\n  const bAvg=fArr.length?fArr.reduce((s,f)=>s+f.avg,0)/fArr.length:0;\n  const critN=fArr.filter(f=>f.c==='red').length;\n  const attN=fArr.filter(f=>f.c==='amb').length;\n  const modN=fArr.filter(f=>f.c==='blu').length;\n  const lowN=fArr.filter(f=>f.c==='grn').length;\n  const bavg={};presentIds.forEach(id=>{const recs=[].concat(...Object.values(byB[id].floors));bavg[id]=recs.length?recs.reduce((s,r)=>s+r.occupancy_pct_andar,0)/recs.length:0;});\n\n  document.getElementById('panel-buildings').innerHTML=`\n  <div style=\"margin-bottom:28px;\">\n    <div class=\"eyebrow\"><span class=\"hero-dot\"><\/span> maquete preditiva · ${active?active.short:'—'}<\/div>\n    <h1 class=\"sec-title\">Prédios e Andares<\/h1>\n    <p class=\"sec-desc\">Maquete 3D interativa por ativo · gire, aproxime e clique em um andar para abrir os detalhes.<\/p>\n  <\/div>\n  <div class=\"g4\" style=\"margin-bottom:28px\">\n    <div class=\"metric-card org\"><div class=\"metric-lbl\">Ativos no recorte<\/div><div class=\"metric-val\" style=\"color:var(--org)\">${P.buildings}<\/div><div class=\"metric-sub\">prédios com previsão ativa<\/div><\/div>\n    <div class=\"metric-card blu\"><div class=\"metric-lbl\">Andar/data<\/div><div class=\"metric-val\" style=\"color:var(--blu)\">${P.floors}<\/div><div class=\"metric-sub\">combinações analisadas<\/div><\/div>\n    <div class=\"metric-card red\"><div class=\"metric-lbl\">Críticos<\/div><div class=\"metric-val\" style=\"color:var(--red)\">${data.filter(d=>d.alerta_nivel==='CRITICO').length}<\/div><div class=\"metric-sub\">pontos acima de 90%<\/div><\/div>\n    <div class=\"metric-card grn\"><di "chip-dot\"><\/span>${lowN} baixa<\/span>\n        <\/div>\n      <\/div>\n      <div>\n        <div style=\"display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px\">\n          <div style=\"font-family:'Space Grotesk',sans-serif;font-weight:500;font-size:15px;color:var(--tx-main)\">Diretório de andares<\/div>\n          <div class=\"fl-meta\">topo → base<\/div>\n        <\/div>\n        <div class=\"fl-dir\">\n          ${fArr.length?[...fArr].reverse().map((f,i)=>`\n            <div class=\"fl-row\" data-andar=\"${f.andar}\" style=\"animation-delay:${i*45}ms\" onclick=\"openModal('${f.rep.floor_id}','${f.rep.data}')\" onmouseenter=\"S.three&&S.three.setEmphasis('${f.andar}',true)\" onmouseleave=\"S.three&&S.three.setEmphasis('${f.andar}',false)\">\n              <div class=\"fl-dot2\" style=\"background:var(--${f.c})\"><\/div>\n              <div style=\"min-width:0\">\n                <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:8px\">\n                  <span class=\"fl-num\">Andar ${f.andar}<\/span>\n                  <span class=\"fl-pct\" style=\"color:var(--${f.c})\">${f.avg.toFixed(0)}%<\/span>\n                <\/div>\n                <div class=\"fl-meta\">${f.base} / ${f.cap} lugares previstos<\/div>\n                <div class=\"fl-bar\"><div class=\"fl-bar-fill js-meter\" data-w=\"${Math.min(100,f.avg).toFixed(1)}\" style=\"background:var(--${f.c})\"><\/div><\/div>\n              <\/div>\n            <\/div>`).join(''):'<div style=\"color:var(--tx-sec);font-size:13px;padding:20px 4px\">Nenhum andar no recorte atual.<\/div>'}\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/div>`;\n\n  requestAnimationFrame(()=>requestAnimationFrame(()=>{document.querySelectorAll('#panel-buildings .js-meter').forEach(el=>{el.style.width=el.dataset.w+'%';});}));\n\n  const container=document.getElementById('tower-canvas');\n  if(container){\n    if(!fArr.length){\n      disposeTower();\n      container.inn <\/div>`;\n}\n\n/* RENDER SIMULATOR */\nfunction renderSimulator(){\n  const panel=document.getElementById('panel-simulator');\n  if(!panel)return;\n  panel.innerHTML=`\n    <div class=\"construction-screen\">\n      <section class=\"construction-card\" aria-labelledby=\"construction-title-panel-simulator\">\n        <div class=\"construction-icon\" aria-hidden=\"true\">⚙<\/div>\n        <h1 id=\"construction-title-panel-simulator\">Simulador de Cenários<\/h1>\n        <p>Esta área está em construção. Estamos preparando os recursos e as informações desta tela para uma próxima atualização.<\/p>\n        <div class=\"construction-badge\"><span class=\"construction-dot\"><\/span> Em construção<\/div>\n      <\/section>\n    <\/div>`;\n}\n\n/* ===== EXPERIÊNCIA 3D DE REDISTRIBUIÇÃO (v4) — motor compartilhado com Prédios e Andares ===== */\nconst R3D={plan:null,state:'before',three:null,mix:0};\nconst TIER_HEX={red:'#D93025',amb:'#E37400',blu:'#008DC0',grn:'#1E8E3E'};\nfunction rrPath(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}\nfunction makeChipSprite(text,opt){\n  const o=Object.assign({fg:'#3C4043',bg:'rgba(255,255,255,0.94)',border:'#E8EAED',font:'650 26px Inter, Arial, sans-serif',padX:20,scale:110},opt||{});\n  const cv=document.createElement('canvas');\n  const tex=new THREE.CanvasTexture(cv);\n  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthWrite:false}));\n  sp.userData.set=function(txt,fg){\n    const mctx=cv.getContext('2d');mctx.font=o.font;\n    const tw=Math.ceil(mctx.measureText(txt).width);\n    cv.width=tw+o.padX*2;cv.height=64;\n    const c2=cv.getContext('2d');\n    c2.clearRect(0,0,cv.width,cv.height);\n    rrPath(c2,2,4,cv.width-4,cv.height-8,17);\n    c2.fillStyle=o.bg;c2.fill();\n    c2.strokeStyle=o.border;c2.lineWidth=2;c2.stroke();\n    c2.font=o.font;c2.textAlign='center';c2.textBaseline='middle';\n    c2.fillStyle=fg||o.fg;\n    c2.fillText(txt,cv.width/2,cv.height/2+1);\n    tex.needsUpdate=true;\n    sp.scale.set(cv.width/o.scale,cv.height/o.scale,1);\n  };\n  if(text)sp.userData.set(text,o.fg);\n  return sp;\n}\n/* Helpers 3D compartilhados entre a torre de Prédios e Andares e o fluxo de redistribuição */\nconst T3D={\n  lights(scene){\n    scene.add(new THREE.HemisphereLight(0xffffff,0xc7d2e0,0.95));\n    const dir=new THREE.DirectionalLight(0xfff1e2,0.55);dir.position.set(6,12,8);scene.add(dir);\n    const fillL=new THREE.DirectionalLight(0xbcd4ff,0.30);fillL.position.set(-7,4,-6);scene.add(fillL);\n    const warm=new THREE.PointLight(0xffb066,0.22,40);warm.position.set(5,-4,5);scene.add(warm);\n  },\n  addBase(g,FW,total){\n    const baseGeo=new THREE.CylinderGeometry(FW*0.95,FW*1.08,0.10,48);\n    const base=new THREE.Mesh(baseGeo,new THREE.MeshStandardMaterial({color:0xffffff,transparent:true,opacity:0.10,roughness:0.6,metalness:0}));\n    base.position.y=-total/2-0.16;g.add(base);\n    base.add(new THREE.LineSegments(new THREE.EdgesGeometry(baseGeo),new THREE.LineBasicMaterial({color:0xC8D2E0,transparent:true,opacity:0.5})));\n    return base;\n  },\n  addShadow(g,FW,total){\n    const scv=document.createElement('canvas');scv.width=scv.height=128;\n    const sx=scv.getContext('2d');\n    const sg=sx.createRadialGradient(64,64,2,64,64,64);\n    sg.addColorStop(0,'rgba(31,31,31,0.16)');sg.addColorStop(0.55,'rgba(31,31,31,0.05)');sg.addColorStop(1,'rgba(31,31,31,0)');\n    sx.fillStyle=sg;sx.fillRect(0,0,128,128);\n    const sh=new THREE.Mesh(new THREE.PlaneGeometry(FW*3.2,FW*3.2),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(scv),transparent:true,opacity:0.85,depthWrite:false}));\n    sh.rotation.x=-Math.PI/2;sh.position.y=-total/2-0.22;g.add(sh);\n    return sh;\n  },\n  addGridDisc(parent,radius,y){\n    const cv=document.createElement('canvas');cv.width=cv.height=512;\n    const x=cv.getContext('2d');\n    x.strokeStyle='rgba(60,70,84,0.16)';x.lineWidth=1;\n    for(let i=0;i<=16;i++){const p=i*32;x.beginPath();x.moveTo(p,0);x.lineTo(p,512);x.stroke();x.beginPath();x.moveTo(0,p);x.lineTo(512,p);x.stroke();}\n    const g=x.createRadialGradient(256,256,40,256,256,256);\n    g.addColorStop(0,'rgba(255,255,255,0)');g.addColorStop(0.62,'rgba(255,255,255,0)');g.addColorStop(1,'rgba(255,255,255,1)');\n    x.globalCompositeOperation='destination-out';\n    x.fillStyle=g;x.fillRect(0,0,512,512);\n    const m=new THREE.Mesh(new THREE.PlaneGeometry(radius*2,radius*2),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(cv),transparent:true,opacity:0.5,depthWrite:false}));\n    m.rotation.x=-Math.PI/2;m.position.y=y;parent.add(m);\n    return m;\n  }\n};\nfunction disposeR3D(){\n  const t=R3D.three;if(!t)return;\n  if(t.raf)cancelAnimationFrame(t.raf);\n  if(t.onResize)window.removeEventListener('resize',t.onResize);\n  if(t.idleTimer)clearTimeout(t.idleTimer);\n  try{t.renderer.dispose();const el=t.renderer.domElement;if(el&&el.parentNode)el.parentNode.removeChild(el);}catch(e){}\n  R3D.three=null;\n}\nfunction r3dStyleFor(role,state){\n  const p=R3D.plan;\n  if(state==='before')return FLOOR_STYLE[role.role==='origin'?'red':'blu'];\n  const pct=role.role==='origin'?p.oAfter:role.move.after;\n  return FLOOR_STYLE[occKey(pct)];\n}\nfunction r3dPctFor(role,state){\n  const p=R3D.plan;\n  if(role.role==='origin')return state==='after'?p.oAfter:p.oBefore;\n  return state==='after'?role.move.after:role.move.before;\n}\nfunction buildFlowScene(){\n  disposeR3D();\n  const p=R3D.plan;const container=document.getElementById('r3d-canvas');\n  if(!p||!container)return;\n  container.innerHTML='';\n  const W=container.clientWidth||860,H=container.clientHeight||620;\n  const scene=new THREE.Scene();\n  const camera=new THREE.PerspectiveCamera(40,W/H,0.1,300);\n  const renderer=new THREE.WebGLRenderer({alpha:true,antialias:true,preserveDrawingBuffer:true});\n  renderer.setClearColor(0x000000,0);\n  renderer.setPixelRatio(Math.min(2,window.devicePixelRatio||1));\n  renderer.setSize(W,H);\n  if('sRGBEncoding' in THREE)renderer.outputEncoding=THREE.sRGBEncoding;\n  container.appendChild(renderer.domElement);\n  T3D.lights(scene);\n\n  const FW=2.7,FH=0.30,GAP=0.06;\n  const bIds=[p.origin.building_id,...p.moves.map(m=>m.rec.building_id)].filter((v,i,a)=>a.indexOf(v)===i);\n  const spacing=FW*2.15;\n  const x0=-(bIds.length-1)*spacing/2;\n  const root=new THREE.Group();scene.add(root);\n  const floorRefs=new Map();\n  const towers=[];const introMeshes=[];const sprites=[];\n  let maxTotal=0;\n  bIds.forEach((bid,bi)=>{\n    let rows=APICE_DATA.filter(r=>r.building_id===bid&&r.data===p.date);\n    if(!rows.length)rows=APICE_DATA.filter(r=>r.building_id===bid);\n    const seen=new Set();rows=rows.filter(r=>{if(seen.has(r.andar))return false;seen.add(r.andar);return true;});\n    rows.sort((a,b)=>floorSort(a.andar,b.andar));\n    const g=new THREE.Group();g.position.x=x0+bi*spacing;root.add(g);\n    const total=rows.length*(FH+GAP);maxTotal=Math.max(maxTotal,total);\n    rows.forEach((r,i)=>{\n      const tier=occKey(r.occupancy_pct_andar);\n      const st=FLOOR_STYLE[tier];\n      const sc=0.80+Math.min(1,r.occupancy_pct_andar/100)*0.22;\n      const geo=new THREE.BoxGeometry(FW*sc,FH,FW*sc);\n      const mat=new THREE.MeshStandardMaterial({color:st.fill,transparent:true,opacity:st.fillOp*0.52,roughness:0.30,metalness:0.05,emissive:st.emissive,emissiveIntensity:st.emI*0.36});\n      const mesh=new THREE.Mesh(geo,mat);\n      mesh.position.y=i*(FH+GAP)+FH/2-total/2;\n      const edges=new THREE.LineSegments(new THREE.EdgesGeometry(geo),new THREE.LineBasicMaterial({color:st.edge,transparent:true,opacity:st.edgeOp*0.62}));\n      mesh.add(edges);\n      g.add(mesh);\n      introMeshes.push({mesh,birth:bi*0.14+i*0.028});\n      floorRefs.set(r.floor_id,{mesh,edges,rec:r,tower:g,sc});\n    });\n    T3D.addBase(g,FW,total);\n    T3D.addShadow(g,FW,total);\n    const bn=makeChipSprite(rows[0]?.buildin e=new THREE.CubicBezierCurve3(a,c1,c2,b);\n    const core=gradientTube(curve,0.024,0.40);\n    const glow=gradientTube(curve,0.062,0.10);\n    root.add(core);root.add(glow);\n    const chip=makeChipSprite(`${m.qty} pessoas`,{fg:'#008DC0',border:'#7FD8F4',font:'650 26px Inter, Arial, sans-serif',padX:22,scale:124});\n    chip.position.copy(curve.getPoint(0.5)).add(new THREE.Vector3(0,0.30,0));root.add(chip);sprites.push(chip);\n    const n=Math.max(4,Math.min(12,Math.round(m.qty/8)));\n    const parts=[];\n    for(let i=0;i<n;i++){\n      const main=new THREE.Mesh(PART_GEO,new THREE.MeshBasicMaterial({color:0xEC6707,transparent:true,opacity:0.9}));\n      const t1=new THREE.Mesh(TRAIL_GEO[0],new THREE.MeshBasicMaterial({color:0xEC6707,transparent:true,opacity:0.45}));\n      const t2=new THREE.Mesh(TRAIL_GEO[1],new THREE.MeshBasicMaterial({color:0xEC6707,transparent:true,opacity:0.22}));\n      particleRoot.add(main);particleRoot.add(t1);particleRoot.add(t2);\n      parts.push({main,trail:[t1,t2],phase:i/n});\n    }\n    flows.push({curve,core,glow,parts});\n  });\n\n  const span=(bIds.length-1)*spacing+FW*1.35;\n  function frame(){\n    const fov=camera.fov*Math.PI/180;\n    const halfH=maxTotal/2+1.25;\n    const halfW=span/2+1.6;\n    const dH=halfH/Math.tan(fov/2);\n    const dW=halfW/(Math.tan(fov/2)*Math.max(0.6,camera.aspect));\n    const dist=Math.max(dH,dW,5.5)*1.05;\n    camera.position.set(dist*0.50,dist*0.24,dist*0.86);\n    controls.target.set(0,0,0);\n    controls.minDistance=Math.max(3.5,dist*0.42);\n    controls.maxDistance=dist*1.9;\n  }\n  const controls=new THREE.OrbitControls(camera,renderer.domElement);\n  controls.enableDamping=true;controls.dampingFactor=0.08;controls.enablePan=false;\n  controls.maxPolarAngle=Math.PI*0.60;\n  controls.autoRotate=true;controls.autoRotateSpeed=0.45;\n  frame();\n  renderer.domElement.style.cursor='grab';\n\n  function onResize(){const w=container.clientWidth,h=container.clientHeight;if(!w||!h)return;camera.aspec
