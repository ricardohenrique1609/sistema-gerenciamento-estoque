asI;\n      cA.setHex(f.edge);cB.setHex(to.edge);cA.lerp(cB,e);\n      role.ref.edges.material.color.copy(cA);\n      role.ref.edges.material.opacity=1;\n      if(role.ring){\n        role.ring.material.color.copy(cA);\n        role.ring.material.opacity=0.42+0.16*(0.5+0.5*Math.sin(el*2.2));\n      }\n      if(role.ping){\n        role.ping.material.color.copy(cA);\n        const ph=wrap01(el*0.42+role.pingOff);\n        role.ping.scale.setScalar(1+0.42*ph);\n        role.ping.material.opacity=0.5*(1-ph)*(el<1.2?el/1.2:1);\n      }\n    });\n    const pOp=(1-e)*0.9*(el<1.2?Math.min(1,el/1.0):1);\n    t.particleRoot.visible=pOp>0.03;\n    t.flows.forEach(fl=>{\n      fl.core.material.opacity=0.40-0.24*e;\n      fl.glow.material.opacity=0.10-0.06*e;\n      fl.parts.forEach(pt=>{\n        const tt=wrap01(el*0.085+pt.phase);\n        const prof=Math.sin(Math.PI*tt);\n        cTmp.copy(cO).lerp(cBl,tt);\n        pt.main.position.copy(fl.curve.getPoint(tt));\n        pt.main.material.color.copy(cTmp);\n        const s=0.75+0.5*prof;\n        pt.main.scale.set(s,s,s);\n        pt.main.material.opacity=pOp*(0.25+0.75*prof);\n        pt.trail.forEach((tr,ti)=>{\n          const tb=wrap01(tt-(ti+1)*0.022);\n          tr.position.copy(fl.curve.getPoint(tb));\n          tr.material.color.copy(cTmp);\n          const ss=s*(ti?0.5:0.7);\n          tr.scale.set(ss,ss,ss);\n          tr.material.opacity=pOp*(0.25+0.75*prof)*(ti?0.2:0.42);\n        });\n      });\n    });\n    controls.update();renderer.render(scene,camera);t.raf=requestAnimationFrame(loop);\n  })();\n}\nfunction applyR3DState(){\n  const b=document.getElementById('r3d-seg-before'),a=document.getElementById('r3d-seg-after');\n  if(b)b.classList.toggle('on',R3D.state==='before');\n  if(a)a.classList.toggle('on',R3D.state==='after');\n  const t=R3D.three,p=R3D.plan;\n  if(!t||!p)return;\n  t.roles.forEach(role=>{\n    if(!role.label)return;\n    const pct=r3dPctFor(role,R3D.state);\n    const tier=R3D.state==='after'?occKey(pct):(role.role==='origin'?'red':'blu');\n    role.label.userData.set(`${role.role==='origin'?'Origem':'Destino'} · ${andarLbl(role.rec.andar)} · ${rnd1(pct)}%`,TIER_HEX[tier]);\n  });\n}\nfunction updateR3DHeader(){\n  const p=R3D.plan;if(!p)return;\n  const dests=p.moves.map(m=>`${m.same?'':m.rec.building_short+' · '}${andarLbl(m.rec.andar)}`).join(' + ');\n  document.getElementById('r3d-title').textContent=p.moves.length?`${p.origin.building_short}: ${andarLbl(p.origin.andar)} → ${dests}`:planTitle(p);\n  const destB=[...new Set(p.moves.filter(m=>!m.same).map(m=>m.rec.building_nome))];\n  document.getElementById('r3d-sub').textContent=`${fdd(p.date)} · ${p.moved} pessoas · absorção de ${p.absorb}% do excesso${destB.length?' · '+p.origin.building_nome+' → '+destB.join(', '):''}`;\n  document.getElementById('r3d-chips').innerHTML=`\n    <span class=\"mini-badge\"><i style=\"width:9px;height:9px;border-radius:3px;background:var(--red);display:inline-block\"><\/i>&nbsp;Origem <strong>${andarLbl(p.origin.andar)}<\/strong><\/span>\n    ${p.moves.map(m=>`<span class=\"mini-badge\"><i style=\"width:9px;height:9px;border-radius:3px;background:var(--blu);display:inline-block\"><\/i>&nbsp;Destino <strong>${m.same?'':m.rec.building_short+' · '}${andarLbl(m.rec.andar)}<\/strong><\/span>`).join('')}`;\n}\nfunction renderR3DSide(){\n  const p=R3D.plan;if(!p)return;\n  const after=R3D.state==='after';\n  const destsTxt=p.moves.map(m=>`${m.same?'':m.rec.building_short+' · '}${andarLbl(m.rec.andar)}`).join(' + ')||'—';\n  const conting=p.moves.reduce((s,m)=>s+Math.max(0,m.room-m.qty),0);\n  document.getElementById('r3d-side').innerHTML=`\n    <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:12px\">\n      <span class=\"chart-kicker\" style=\"margin:0\">plano de redistribuição<\/span>\n      <span class=\"conf ${p.conf.cls}\" title=\"${p.conf.desc}\"><i><\/i>${p.conf.label}<\/span>\n    <\/div>\n    <div class=\"sb\">\n      <h6>Decisão<\/h6>\n      <div class=\"sb-kv\"><span>Mover<\/span><b>${p.moved} pessoas<\/b><\/div>\n      <div class=\"sb-kv\"><span>Origem<\/span><b>${p.origin.building_short} · ${andarLbl(p.origin.andar)}<\/b><\/div>\n      <div class=\"sb-kv\"><span>Destino${p.moves.length>1?'s':''}<\/span><b>${destsTxt}<\/b><\/div>\n      <div class=\"sb-kv\"><span>Data<\/span><b>${fdd(p.date)}<\/b><\/div>\n    <\/div>\n    <div class=\"sb\">\n      <h6>Resultado esperado · ${after?'cenário redistribuído':'cenário original'}<\/h6>\n      <div class=\"xrows\" style=\"gap:12px\">\n        ${after?xrowHTML(`${p.origin.building_short} · ${andarLbl(p.origin.andar)}`,'origem',p.oBefore,p.oAfter):xrowHTML(`${p.origin.building_short} · ${andarLbl(p.origin.andar)}`,'origem · hoje',null,p.oBefore)}\n        ${p.moves.map(m=>after?xrowHTML(`${m.rec.building_short} · ${andarLbl(m.rec.andar)}`,`recebe ${m.qty} pessoas`,m.before,m.after):xrowHTML(`${m.rec.building_short} · ${andarLbl(m.rec.andar)}`,`destino · ${m.room} posições seguras`,null,m.before)).join('')}\n      <\/div>\n      <div class=\"sb-kv\" style=\"margin-top:10px\"><span>Excesso absorvido<\/span><b>${p.absorb}% (${p.moved} de ${p.excess})<\/b><\/div>\n      <div class=\"sb-kv\"><span>Risco residual<\/span><b style=\"color:var(--${p.oAfter>=90?'red':p.oAfter>=80?'amb':'grn'})\">${planResidLabel(p)}<\/b><\/div>\n    <\/div>\n    <div class=\"sb\">\n      <h6>Segurança do plano<\/h6>\n      <div class=\"sb-kv\"><span>Origem pós-ação · P50<\/span><b>${p.oAfter}%<\/b><\/div>\n      <div class=\"sb-kv\"><span>Origem pós-ação · P90<\/span><b style=\"color:var(--${p.oAfter90>=100?'red':'tx-main'})\">${p.oAfter90}%<\/b><\/div>\n      ${p.moves.map(m=>`<div class=\"sb-kv\"><span>${andarLbl(m.rec.andar)}${m.same?'':' · '+m.rec.building_short} · P90 pós<\/span><b>${rnd1(m.after90)}%<\/b><\/div>`).join('')}\n      <div class=\"sb-kv\"><span>Contingência restante<\/span><b>${conting.toLocaleString('pt-BR')} posições<\/b><\/div>\n      ${p.residual>0?`<div class=\"sb-warn\">Permanecem ${p.residual} pessoas sem destino recomendado (${100-p.absorb}% do excesso).<\/div>`:''}\n      ${p.oAfter90>=100?`<div class=\"sb-warn red\">No cenário máximo (P90), a origem ainda excede a capacidade após a ação — manter contingência local.<\/div>`:''}\n    <\/div>\n    ${r3dFitBlock(p)}\n    <div class=\"sb\">\n      <h6>Alternativas<\/h6>\n      ${p.alts.length?p.alts.map(a=>{\n        const best=p.moves[0]?p.moves[0].room:Infinity;\n        const reason=a.rec.cluster_nome==='Volátil'?'padrão volátil':a.room<best?'menor capacidade segura':'fora da 1ª opção por distância operacional';\n        return `<div class=\"sb-kv\"><span>${a.rec.building_short} · ${andarLbl(a.rec.andar)}<\/span><b>${a.room} pos. · ${reason}<\/b><\/div>`;\n      }).join(''):'<div class=\"sb-kv\"><span>Sem alternativas seguras adicionais nesta data<\/span><b>—<\/b><\/div>'}\n    <\/div>\n    <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n      <button class=\"dbtn\" onclick=\"closeR3D();openModal('${p.origin.floor_id}','${p.date}')\">Detalhe da origem<\/button>\n      ${p.moves.map(m=>`<button class=\"dbtn\" onclick=\"closeR3D();openModal('${m.rec.floor_id}','${p.date}')\">${andarLbl(m.rec.andar)}${m.same?'':' · '+m.rec.building_short}<\/button>`).join('')}\n    <\/div>`;\n}\nfunction openPlan3D(planId){\n  const p=INTEL.plans().find(x=>x.id===planId);\n  if(!p)return;\n  R3D.plan=p;R3D.state='before';R3D.mix=0;\n  document.getElementById('r3d-ov').classList.add('open');\n  document.body.style.overflow='hidden';\n  updateR3DHeader();renderR3DSide();\n  const c=document.getElementById('r3d-canvas');\n  if(typeof THREE==='undefined'||typeof THREE.OrbitControls==='undefined'){\n    c.innerHTML='<div style=\"position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--tx-sec);font-size:13px;padding:30px\">Visualização 3D indisponível neste ambiente.<br>Use a evidência ao lado para avaliar o plano.<\/div>';\n    applyR3DState();\n  }else{\n    const build=()=>{buildFlowScene();applyR3DState();};\n    if(c.clientWidth>0)build();else requestAnimationFrame(build);\n  }\n}\nfunction closeR3D(){\n  document.getElementById('r3d-ov').classList.remove('open');\n  document.body.style.overflow='';\n  disposeR3D();\n}\nfunction setR3DState(s){\n  if(R3D.state===s)return;\n  R3D.state=s;\n  applyR3DState();renderR3DSide();\n}\n\n/* EMPTY STATE */\nfunction renderEmptyState(){\n  const tc=document.querySelector('.top-controls');if(tc)tc.style.display='none';\n  const main=document.getElementById('main');\n  main.style.padding='150px 24px 60px';\n  const err=window.__APICE_DATA_ERRO__?`<div class=\"empty-err\">Detalhe técnico: ${String(window.__APICE_DATA_ERRO__)}<\/div>`:'';\n  main.innerHTML=`<div class=\"empty-wrap\"><div class=\"empty-card\">\n    <div class=\"empty-mark\">ÁPICE<\/div>\n    <h1>Aguardando os dados da semana<\/h1>\n    <p>O painel está pronto, mas o bloco de dados editável está vazio ou não pôde ser lido. Assim que os dados da semana forem colados no arquivo, todos os indicadores, alertas e recomendações serão calculados automaticamente.<\/p>\n    <ol class=\"empty-steps\">\n      <li>Abra este arquivo HTML em um editor de texto.<\/li>\n      <li>Localize o bloco <code>APICE_DADOS_EDITAVEIS<\/code> no início do arquivo.<\/li>\n      <li>Substitua o conteúdo entre as tags pela lista JSON da semana — começa com <code>[<\/code> e termina com <code>]<\/code>.<\/li>\n      <li>Salve e reabra o arquivo no navegador.<\/li>\n    <\/ol>\n    ${err}\n  <\/div><\/div>`;\n}\n\n/* MODAL */\nfunction openModal(floorId,dateStr){\n  let rec=APICE_DATA.find(d=>d.floor_id===floorId&&d.data===dateStr);\n  if(!rec)rec=APICE_DATA.find(d=>d.floor_id===floorId);\n  if(!rec){document.getElementById('modal-body').innerHTML=`<div class=\"mhead\"><div><h2 class=\"mtitle\">${floorId}<\/h2><\/div><button class=\"mclose\" onclick=\"document.getElementById('modal-ov').classList.remove('open')\">✕<\/button><\/div><p style=\"color:var(--tx-sec);padding:8px 0\">Dados não encontrados.<\/p>`;document.getElementById('modal-ov').classList.add('open');return;}\n  const c=cc(rec.occupancy_pct_andar);\n  const maxA=Math.max(rec.pred_p90_andar,rec.capacidade)*1.05;\n  const p10L=Math.round((rec.pred_p10_andar/maxA)*100);\n  const p90L=Math.round((rec.pred_p90_andar/maxA)*100);\n  const p50L=Math.round((rec.pred_p50_andar/maxA)*100);\n  const capL=Math.min(98,Math.round((rec.capacidade/maxA)*100));\n  const fillW=Math.max(0,p90L-p10L);\n  const recomMap={\n    'CRITICO':'Ocupação crítica prevista (≥90%). Recomenda-se bloqueio de acesso adicional, ativação do plano de lotação máxima e comunicação imediata às equipes de Segurança e Facilities.',\n    'ATENCAO':'Nível de atenção (80–90%). Monitorar fluxo de entrada e considerar redistribuição proativa para andares com menor pressão no mesmo prédio.',\n    'NORMAL':'Ocupação dentro dos parâmetros normais. Nenhuma ação necessária — manter monitoramento padrão e revisão periódica.'\n  };\n  document.getElementById('modal-body').innerHTML=`\n  <div class=\"mhead\">\n    <div>\n      <h2 class=\"mtitle\">${rec.building_nome}<\/h2>\n      <div class=\"msub\">Andar ${rec.andar} &nbsp;·&nbsp; ${fd(rec.data)} (${rec.dia_semana}) &nbsp;·&nbsp; ${clbadge(rec.cluster_nome)} &nbsp;<span class=\"chip ${c}\" style=\"font-size:11px\">${nlbl(rec.alerta_nivel)}<\/span><\/div>\n    <\/div>\n    <button class=\"mclose\" onclick=\"document.getElementById('modal-ov').classList.remove('open')\">✕<\/button>\n  <\/div>\n  <div class=\"mgrid\">\n    <div><div class=\"mkv\" style=\"color:var(--${c})\">${rec.occupancy_pct_andar}%<\/div><div class=\"mkl\">Ocupação Prevista<\/div><\/div>\n    <div><div class=\"mkv\">${rec.pred_p50_andar}<\/div><div class=\"mkl\">Pessoas Previstas<\/div><\/div>\n    <div><div class=\"mkv\">${rec.capacidade}<\/div><div class=\"mkl\">Capacidade<\/div><\/div>\n  <\/div>\n  <div style=\"font-size:12px;font-weight:600;text-transform:uppercase;color:var(--tx-mut);letter-spacing:.08em;margin-bottom:8px\">Banda de Confiança<\/div>\n  <div class=\"mbarbg\">\n    <div class=\"mbarfill\" style=\"left:${p10L}%;width:${fillW}%\"><\/div>\n    <div class=\"mmk p50\" style=\"left:${p50L}%\"><\/div>\n    <div class=\"mmk cap\" style=\"left:${capL}%\"><\/div>\n  <\/div>\n  <div class=\"mlabels\">\n    <span>${rec.pred_p10_andar} <strong>Mínimo<\/strong><\/span>\n    <span>${rec.pred_p50_andar} <strong>Previsto<\/strong><\/span>\n    <span>${rec.pred_p90_andar} <strong>Máximo<\/strong><\/span>\n  <\/div>\n  <div style=\"display:flex;gap:20px;margin-bottom:20px;font-size:13px;color:var(--tx-sec)\">\n    <span>MAE: <strong style=\"color:var(--tx-main)\">${rec.mae_modelo} pessoas<\/strong><\/span>\n    <span>sMAPE: <strong style=\"color:var(--tx-main)\">${rec.smape_modelo.toFixed(1)}%<\/strong><\/span>\n    <span style=\"margin-left:auto;font-size:12px\"><span style=\"color:var(--red)\">━<\/span> Cap. máxima &nbsp;·&nbsp; <span style=\"color:var(--blu)\">━<\/span> Previsto<\/span>\n  <\/div>\n  <div class=\"mrec\">${recomMap[rec.alerta_nivel]}<\/div>\n  ${rec.alerta_nivel!=='NORMAL'?(()=>{const cf=INTEL.confidence(rec);return `<div style=\"margin-top:14px;font-size:12.5px;color:var(--tx-sec);line-height:1.6\"><span class=\"conf ${cf.cls}\"><i><\/i>${cf.label}<\/span> &nbsp;Banda P10–P90 de ${cf.band}pp. ${cf.desc}<\/div>`;})():''}\n  ${modalHierBlock(rec)}\n  <div style=\"display:flex;gap:10px;margin-top:22px;flex-wrap:wrap\">\n    <button class=\"dbtn\" onclick=\"goToBuildingFloor('${rec.building_id}','${String(rec.andar).replace(/'/g,'')}')\">Ver prédio em 3D<\/button>\n    ${(()=>{const pl=INTEL.plans().find(p=>p.origin.floor_id===rec.floor_id&&p.date===rec.data&&p.moves.length);return pl?`<button class=\"dbtn pri\" onclick=\"openPlanFromModal('${pl.id}')\">Ver redistribuição em 3D<\/button>`:'';})()}\n  <\/div>`;\n  document.getElementById('modal-ov').classList.add('open');\n}\nfunction closeModal(e){if(e.target===document.getElementById('modal-ov'))document.getElementById('modal-ov').classList.remove('open');}\n\n/* ROUTING — no inline style manipulation, CSS handles animation */\nfunction renderTab(id){\n  ({exec:renderExec,alerts:renderAlerts,strategy:renderStrategy,teams:renderTeams,\n    buildings:renderBuildings,precision:renderPrecision,simulator:renderSimulator})[id]?.();\n}\nfunction switchTab(id){\n  S.tab=id;\n  if(id!=='buildings')disposeTower();\n  document.querySelectorAll('.tbtn').forEach((b,i)=>b.classList.toggle('active',TAB_IDS[i]===id));\n  document.querySelectorAll('.tpanel').forEach(p=>p.classList.remove('active'));\n  document.getElementById('panel-'+id).classList.add('active');\n  renderTab(id);\n}\nfunction floorSort(a,b){return String(a).localeCompare(String(b),'pt-BR',{numeric:true});}\nfunction floorOptionsFor(buildingId){\n  const floors=new Set();\n  APICE_DATA.forEach(d=>{\n    if(buildingId&&!sameValue(d.building_id,buildingId))return;\n    floors.add(String(d.andar ?? '').trim());\n  });\n  return [...floors].filter(Boolean).sort(floorSort);\n}\nfunction updateFloorOptions(){\n  const floorSel=document.getElementById('f-floor');\n  if(!floorSel)return;\n  const current=floorSel.value;\n  const building=document.getElementById('f-bld')?.value||'';\n  floorSel.innerHTML='';\n  floorSel.appendChild(new Option('Todos os andares',''));\n  floorOptionsFor(building).forEach(f=>floorSel.appendChild(new Option(`Andar ${f}`,f)));\n  floorSel.value=[...floorSel.options].some(o=>o.value===current)?current:'';\n}\nfunction applyFilters(){\n  const previousBuilding=S.filters.building;\n  S.filters.date=document.getElementById('f-date').value;\n  S.filters.building=document.getElementById('f-bld').value;\n  if(previousBuilding!==S.filters.building)updateFloorOptions();\n  S.filters.floor=document.getElementById('f-floor')?.value||'';\n  S.filters.level=document.getElementById('f-lvl').value;\n  renderTab(S.tab);\n}\nfunction resetFilters(){\n  ['f-date','f-bld','f-floor','f-lvl'].forEach(id=>{const el=document.getElementById(id);if(el)el.value='';});\n  S.filters={date:'',building:'',floor:'',level:''};\n  updateFloorOptions();\n  renderTab(S.tab);\n}\nlet APICE_BOOTED=false;\nfunction resetSelectOptions(select,placeholder){\n  if(!select)return;\n  select.innerHTML='';\n  select.appendChild(new Option(placeholder,''));\n}\nfunction init(){\n  if(APICE_BOOTED)return;\n  const dSel=document.getElementById('f-date'),bSel=document.getElementById('f-bld');\n  if(!dSel||!bSel)return;\n  APICE_BOOTED=true;\n  const hDate=document.getElementById('h-date');\n  if(hDate)hDate.textContent=new Date().toLocaleDateString('pt-BR',{day:'2-digit',month:'short',year:'numeric'});\n  if(APICE_EMPTY){renderEmptyState();return;}\n  if(typeof HIER_AVAILABLE!=='undefined'&&!HIER_AVAILABLE){const tb=document.querySelector(\".tbtn[onclick*='teams']\");if(tb){tb.style.opacity='.55';tb.title='Dados de hierarquia não disponíveis neste recorte.';}}\n  resetSelectOptions(dSel,'Todas as datas');\n  resetSelectOptions(bSel,'Todos os prédios');\n  FORECAST_DATES.forEach(d=>dSel.appendChild(new Option(`${fd(d)} (${DATE_INFO[d]?.[0]||''})`,d)));\n  BUILDINGS_CONFIG.forEach(b=>bSel.appendChild(new Option(b.nome,b.id)));\n  updateFloorOptions();\n  renderExec();\n}\nif(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init,{once:true});\nelse init();\nsetTimeout(init,0);\n<\/script>\n\n<script>\n(function(){\n  async function toggleFullscreen(){\n    try{\n      if(!document.fullscreenElement){\n        await document.documentElement.requestFullscreen();\n      }else{\n        await document.exitFullscreen();\n      }\n    }catch(e){\n      console.warn('Tela cheia não disponível neste navegador.',e);\n    }\n  }\n  window.addEventListener('keydown',function(e){\n    if(e.key.toLowerCase()==='f'&&!e.ctrlKey&&!e.altKey&&!e.metaKey){\n      const tag=(e.target&&e.target.tagName)||'';\n      if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT'||(e.target&&e.target.isContentEditable))return;\n      e.preventDefault();\n      toggleFullscreen();\n    }\n  },true);\n})();\n<\/script>\n<script>\n\n/* ===================== FILTROS · UI PREMIUM (enhancer de <select>) =====================\n   Não altera nenhuma regra de negócio: os <select> originais continuam no DOM como\n   fonte da verdade (value, options, onchange). Esta camada só desenha a interface. */\n(function(){\n  var SV='viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"';\n  var ICONS={\n    'f-date':'<svg '+SV+'><rect x=\"3\" y=\"4.5\" width=\"18\" height=\"16\" rx=\"3\"><\/rect><path d=\"M3 9.5h18M8 2.5v4M16 2.5v4\"><\/path><\/svg>',\n    'f-bld' :'<svg '+SV+'><path d=\"M3 21h18M5 21V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v16M15 21V10h3a2 2 0 0 1 2 2v9\"><\/path><path d=\"M8.5 7h2M8.5 11h2M8.5 15h2\"><\/path><\/svg>',\n    'f-floor':'<svg '+SV+'><path d=\"M12 3 3 7.5l9 4.5 9-4.5L12 3Z\"><\/path><path d=\"M3 12.5 12 17l9-4.5M3 17 12 21.5 21 17\"><\/path><\/svg>',\n    'f-lvl' :'<svg '+SV+'><path d=\"M10.3 4.3 2.6 17.5A1.9 1.9 0 0 0 4.3 20.4h15.4a1.9 1.9 0 0 0 1.7-2.9L13.7 4.3a1.9 1.9 0 0 0-3.4 0Z\"><\/path><path d=\"M12 9.5v4M12 17h.01\"><\/path><\/svg>',\n    'def'   :'<svg '+SV+'><path d=\"M4 5.5h16M7 12h10M10.5 18.5h3\"><\/path><\/svg>'\n  };\n  var CHEV='<svg '+SV+'><path d=\"m6 9.5 6 6 6-6\"><\/path><\/svg>';\n  var CHECK='<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m5 12.5 4.5 4.5L19 7\"><\/path><\/svg>';\n  var XICO='<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.8\" stroke-linecap=\"round\"><path d=\"M6 6l12 12M18 6 6 18\"><\/path><\/svg>';\n  var SEARCH='<svg '+SV+'><circle cx=\"11\" cy=\"11\" r=\"7\"><\/circle><path d=\"m20 20-3.6-3.6\"><\/path><\/svg>';\n  var ERASE='<svg '+SV+'><path d=\"M3 12a9 9 0 1 0 2.6-6.4\"><\/path><path d=\"M3 4v5h5\"><\/path><\/svg>';\n  var DOTS={'CRITICO':'var(--red)','ATENCAO':'var(--amb)','NORMAL':'var(--grn)'};\n  var vdesc=Object.getOwnPropertyDescriptor(HTMLSelectElement.prototype,'value');\n  var open=null;\n\n  function norm(s){return (s||'').toString().toLowerCase().normalize('NFD').replace(/[\\u0300-\\u036f]/g,'');}\n\n  function build(sel){\n    if(sel.dataset.fx)return;\n    sel.dataset.fx='1';\n    var wrap=document.createElement('div');\n    wrap.className='fx'+((parseFloat(sel.style.height)||40)<38?' sm':'');\n    sel.parentNode.insertBefore(wrap,sel);\n    wrap.appendChild(sel);\n    sel.classList.add('fx-native');\n    sel.setAttribute('tabindex','-1');\n    sel.setAttribute('aria-hidden','true');\n\n    var btn=document.createElement('button');\n    btn.type='button';btn.className='fx-btn';\n    btn.setAttribute('aria-haspopup','listbox');btn.setAttribute('aria-expanded','false');\n    btn.innerHTML='<span class=\"fx-ico\">'+(ICONS[sel.id]||ICONS.def)+'<\/span><span class=\"fx-txt\"><\/span>'+\n                  '<span class=\"fx-chev\">'+CHEV+'<\/span><span class=\"fx-x\" title=\"Limpar este filtro\">'+XICO+'<\/span>';\n    wrap.appendChild(btn);\n\n    var pop=document.createElement('div');\n    pop.className='fx-pop';\n    pop.innerHTML='<div class=\"fx-pop-hd\"><\/div><div class=\"fx-srch\">'+SEARCH+'<input type=\"text\" placeholder=\"Buscar...\" spellcheck=\"false\"><\/div><div class=\"fx-list\" role=\"listbox\"><\/div>';\n    document.body.appendChild(pop);\n\n    var head=pop.querySelector('.fx-pop-hd');\n    var srch=pop.querySelector('.fx-srch');\n    var inp=pop.querySelector('.fx-srch input');\n    var list=pop.querySelector('.fx-list');\n    var txt=btn.querySelector('.fx-txt');\n    var hl=-1;\n\n    var api={sel:sel,wrap:wrap,btn:btn,pop:pop,close:close,place:place};\n\n    function opts(){return Array.prototype.slice.call(sel.options);}\n    function placeholder(){var o=opts()[0];return o&&o.value===''?o.text:'Selecionar';}\n\n    function sync(      if(srch.style.display!=='none')setTimeout(function(){try{inp.focus({preventScroll:true});}catch(e){inp.focus();}},60);\n    }\n    function close(){\n      pop.classList.remove('open');wrap.classList.remove('open');\n      btn.setAttribute('aria-expanded','false');\n      if(open===api)open=null;\n    }\n    function pick(i){\n      var o=opts()[i];if(!o)return;\n      sel.value=o.value;\n      sel.dispatchEvent(new Event('change',{bubbles:true}));\n      close();btn.focus();\n    }\n    function move(d){\n      var items=list.querySelectorAll('.fx-opt');if(!items.length)return;\n      if(hl<0){var c=list.querySelector('.fx-opt.sel');hl=c?Array.prototype.indexOf.call(items,c):-1;}\n      hl=(hl+d+items.length)%items.length;\n      items.forEach(function(el){el.classList.remove('hl');});\n      items[hl].classList.add('hl');items[hl].scrollIntoView({block:'nearest'});\n    }\n\n    btn.addEventListener('click',function(e){\n      if(e.target.closest('.fx-x')){\n        e.stopPropagation();\n        sel.value='';sel.dispatchEvent(new Event('change',{bubbles:true}));return;\n      }\n      pop.classList.contains('open')?close():openPop();\n    });\n    btn.addEventListener('keydown',function(e){\n      if(e.key==='ArrowDown'||e.key==='Enter'||e.key===' '){e.preventDefault();if(!pop.classList.contains('open'))openPop();else move(1);}\n      else if(e.key==='Escape')close();\n    });\n    list.addEventListener('click',function(e){\n      var o=e.target.closest('.fx-opt');if(o)pick(+o.dataset.i);\n    });\n    inp.addEventListener('input',render);\n    inp.addEventListener('keydown',function(e){\n      if(e.key==='ArrowDown'){e.preventDefault();move(1);}\n      else if(e.key==='ArrowUp'){e.preventDefault();move(-1);}\n      else if(e.key==='Enter'){\n        e.preventDefault();\n        var items=list.querySelectorAll('.fx-opt');\n        var el=items[hl>=0?hl:0];if(el)pick(+el.dataset.i);\n      }else if(e.key==='Escape'){e.preventDefault();close();btn.focus();}\n    });\n\n    /* value setado por código (resetFilters, updateFloorOptions) */\n    try{\n      Object.defineProperty(sel,'value',{\n        configurable:true,\n        get:function(){return vdesc.get.call(sel);},\n        set:function(v){vdesc.set.call(sel,v);sync();}\n      });\n    }catch(e){}\n\n    /* options recriadas por código */\n    new MutationObserver(function(){sync();}).observe(sel,{childList:true,subtree:true});\n    sel.addEventListener('change',sync);\n    api.destroyCheck=function(){if(!sel.isConnected){pop.remove();return true;}return false;};\n    INSTANCES.push(api);\n    sync();\n  }\n\n  var INSTANCES=[];\n  function enhanceAll(){\n    INSTANCES=INSTANCES.filter(function(a){return !a.destroyCheck();});\n    document.querySelectorAll('select.f-sel').forEach(build);\n    var bar=document.getElementById('fbar');\n    if(bar && !bar.querySelector('.fx-label')){\n      var lb=document.createElement('span');\n      lb.className='fx-label';\n      lb.innerHTML='<svg '+SV+'><path d=\"M4 5.5h16M7 12h10M10.5 18.5h3\"><\/path><\/svg>Filtros';\n      bar.insertBefore(lb,bar.firstChild);\n    }\n    var rs=document.querySelector('.f-reset');\n    if(rs && !rs.dataset.fx){rs.dataset.fx='1';rs.innerHTML=ERASE+'<span>Limpar<\/span>';}\n  }\n\n  document.addEventListener('mousedown',function(e){\n    if(!open)return;\n    if(e.target.closest('.fx-pop')||e.target.closest('.fx'))return;\n    open.close();\n  },true);\n  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&open)open.close();});\n  window.addEventListener('resize',function(){if(open)open.close();});\n  window.addEventListener('scroll',function(){if(open)open.place();},true);\n\n  var tick;\n  new MutationObserver(function(){clearTimeout(tick);tick=setTimeout(enhanceAll,60);})\n    .observe(document.documentElement,{childList:true,subtree:true});\n\n  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',enhanceAll,{once:true});\n  else enhanceAll();\n  setT
