document.addEventListener('DOMContentLoaded', async function() {
  // Captura os dados editaveis antes de o empacotador substituir o documento.

  let apiceDataEditable = [];
  let apiceDataErro = '';
  try {
    apiceDataEditable = JSON.parse(apiceDataEditableEl ? apiceDataEditableEl.textContent : '[]');

  }
  const apiceHierEl = document.getElementById('APICE_HIERARQUIA_EDITAVEL');
  let apiceHierEditable = null;
  let apiceHierErro = '';
  try {
    const _h = apiceHierEl ? apiceHierEl.textContent.trim() : '';

  function setStatus(msg) { if (loading) loading.textContent = msg; }

  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const dataScript = '<script>window.__APICE_DATA_EDITAVEL__ = ' + JSON.stringify(apiceDataEditable).split('</' + 'script>').join('<\\/' + 'script>') + ';window.__APICE_DATA_ERRO__ = ' + JSON.stringify(apiceDataErro).split('</' + 'script>').join('<\\/' + 'script>') + ';<\/' + 'script>';
    const hierScript = '<script>window.__APICE_HIER_EDITAVEL__ = ' + JSON.stringify(apiceHierEditable).split('</' + 'script>').join('<\\/' + 'script>') + ';window.__APICE_HIER_ERRO__ = ' + JSON.stringify(apiceHierErro).split('</' + 'script>').join('<\\/' + 'script>') + ';<\/' + 'script>';
    const resourceScript = dataScript + hierScript + '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

s=\"h-meta\">\n    <div class=\"h-dot\"><\/div>\n    Modelo ativo &nbsp;·&nbsp;\n    <span id=\"h-date\"><\/span>\n  <\/div>\n<\/header>\n\n<div class=\"top-controls\">\n  <nav id=\"tbar\">\n    <button class=\"tbtn active\" onclick=\"switchTab('exec')\">Resumo Executivo<\/button>\n    <button class=\"tbtn\" onclick=\"switchTab('alerts')\">Alertas<\/button>\n    <button class=\"tbtn\" onclick=\"switchTab('strategy')\">Central de Decisão<\/button>\n    <button class=\"tbtn\" onclick=\"switchTab('buildings')\">Prédios e Andares<\/button>\n    <button class=\"tbtn\" onclick=\"switchTab('precision')\">Precisão do Modelo<\/button>\n    <button class=\"tbtn\" onclick=\"switchTab('simulator')\">Simulador<\/button>\n  <\/nav>\n  <div id=\"fbar\">\n    <select class=\"f-sel\" id=\"f-date\" onchange=\"applyFilters()\"><option value=\"\">Todas as datas<\/option><\/select>\n    <select class=\"f-sel\" id=\"f-bld\" onchange=\"applyFilters()\"><option value=\"\">Todos os prédios<\/option><\/select>\n    <select class=\"f-sel\" id=\"f-floor\" onchange=\"applyFilters()\"><option value=\"\">Todos os andares<\/option><\/select>\n    <select class=\"f-sel\" id=\"f-lvl\" onchange=\"applyFilters()\">\n      <option value=\"\">Todos os níveis<\/option>\n      <option value=\"CRITICO\">Crítico<\/option>\n      <option value=\"ATENCAO\">Atenção<\/option>\n      <option value=\"NORMAL\">Normal<\/option>\n    <\/select>\n    <button class=\"f-reset\" onclick=\"resetFilters()\">Limpar<\/button>\n  <\/div>\n<\/div>\n\n<main id=\"main\">\n  <div class=\"tpanel active\" id=\"panel-exec\"><\/div>\n  <div class=\"tpanel\" id=\"panel-alerts\"><\/div>\n  <div class=\"tpanel\" id=\"panel-strategy\"><\/div>\n  <div class=\"tpanel\" id=\"panel-buildings\"><\/div>\n  <div class=\"tpanel\" id=\"panel-precision\"><\/div>\n  <div class=\"tpanel\" id=\"panel-simulator\"><\/div>\n<\/main>\n\n<div class=\"mov\" id=\"modal-ov\" onclick=\"closeModal(event)\">\n  <div class=\"modal\" id=\"modal-body\"><\/div>\n<\/div>\n\n<div class=\"r3d\" id=\"r3d-ov\">\n <div class=\"r3d-modal\">\n  <div class=\"r3d-hd\">\n    <button class=\"dbtn\" onclick=\"closeR3D()\">← Voltar<\/button>\n    <div style=\"min-width:0\">\n      <div class=\"r3d-title\" id=\"r3d-title\">Fluxo de redistribuição<\/div>\n      <div class=\"r3d-sub\" id=\"r3d-sub\"><\/div>\n    <\/div>\n    <div style=\"flex:1\"><\/div>\n    <div class=\"seg\" id=\"r3d-seg\">\n      <button id=\"r3d-seg-before\" class=\"on\" onclick=\"setR3DState('before')\">Antes<\/button>\n      <button id=\"r3d-seg-after\" onclick=\"setR3DState('after')\">Depois<\/button>\n    <\/div>\n    <button class=\"mclose\" onclick=\"closeR3D()\" style=\"margin-left:4px\">✕<\/button>\n  <\/div>\n  <div class=\"r3d-body\">\n    <div class=\"r3d-stage\">\n      <div id=\"r3d-canvas\" style=\"position:absolute;inset:0\"><\/div>\n      <div class=\"r3d-chips\" id=\"r3d-chips\"><\/div>\n      <div class=\"r3d-hint\">arraste para girar · scroll para zoom<\/div>\n    <\/div>\n    <aside class=\"r3d-side\" id=\"r3d-side\"><\/aside>\n  <\/div>\n <\/div>\n<\/div>\n\n<script>\n/* DATA */\nconst APICE_DATA_BRUTO=window.__APICE_DATA_EDITAVEL__;\nfunction apiceSlug(v){return String(v??'').normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'');}\nconst APICE_DATA_JSON=(Array.isArray(APICE_DATA_BRUTO?.[0]))?APICE_DATA_BRUTO.map(r=>{const [building_nome,andar,dia_semana,capacidade,p10,p50,p90,pct_previsto,alerta_nivel,data]=r;const building_id=apiceSlug(building_nome);const nivel=String(alerta_nivel||'NORMAL').toUpperCase();return{data,dia_semana,building_id,building_nome,building_short:building_nome,floor_id:`${building_id}_${apiceSlug(andar)}`,andar:String(andar),capacidade,pred_p10_andar:p10,pred_p50_andar:p50,pred_p90_andar:p90,occupancy_pct_andar:Number(pct_previsto)*100,alerta_tipo:nivel.toLowerCase(),alerta_nivel:nivel,alerta_label:nivel==='CRITICO'?'Ocupação crítica prevista':nivel==='ATENCAO'?'Ocupação em atenção':'Ocupação normal'};}):APICE_DATA_BRUTO;\nconst APICE_DATA_LISTA=Array.isArray(APICE_DATA_JSON)?APICE_DATA_JSON:[];\n\nfunction toNumber(value,fallback=0){\n  const n=Number(value);\n  return Number.isFinite(n)?n:fallback;\n}\nfunction shortBuildingName(nome){\n  const clean=String(nome||'').trim();\n  if(!clean)return 'Sem ativo';\n  return clean\n    .replace(/^Torre\\s+/i,'T. ')\n    .replace(/^Centro Empresarial\\s+/i,'C.E. ')\n    .replace(/Walter Moreira Salles/i,'W. M. Salles');\n}\nfunction normalizeApiceRecord(row){\n  const buildingId=String(row.building_id||'').trim();\n  const buildingNome=String(row.building_nome||buildingId||'Sem ativo').trim();\n  const andar=String(row.andar ?? '').trim();\n  const capacidade=toNumber(row.capacidade);\n  const predP50=toNumber(row.pred_p50_andar ?? row.pred_p50_hier);\n  const predP10=toNumber(row.pred_p10_andar ?? row.pred_p10_hier ?? predP50);\n  const predP90=toNumber(row.pred_p90_andar ?? row.pred_p90_hier ?? predP50);\n  const occupancy=toNumber(row.occupancy_pct_andar ?? row.occupancy_pct_hier ?? (capacidade?predP50/capacidade*100:0));\n  const alertaNivel=String(row.alerta_nivel || (occupancy>=90?'CRITICO':occupancy>=80?'ATENCAO':'NORMAL')).toUpperCase();\n  return {\n    ...row,\n    data:String(row.data||''),\n    dia_semana:String(row.dia_semana||''),\n    dia_semana_num:toNumber(row.dia_semana_num),\n    building_id:buildingId,\n    building_nome:buildingNome,\n    building_short:String(row.building_short||shortBuildingName(buildingNome)),\n    floor_id:String(row.floor_id||`${buildingId}_${andar}`),\n    andar,\n    capacidade,\n    pred_p50_andar:predP50,\n    pred_p10_andar:predP10,\n    pred_p90_andar:predP90,\n    occupancy_pct_andar:Math.round(occupancy*10)/10,\n    alerta_tipo:String(row.alerta_tipo||alertaNivel.toLowerCase()),\n    alerta_nivel:alertaNivel,\n    alerta_label:String(row.alerta_label||alertaNivel),\n    is_ponte:toNumber(row.is_ponte),\n    is_vespera_feriado:toNumber(row.is_vespera_feriado),\n    is_feriado_prox:toNumber(row.is_feriado_prox),\n    mae_modelo:toNumber(row.mae_modelo ?? row.erro_abs),\n    smape_modelo:toNumber(row.smape_modelo ?? row.smape ?? row.smape_treino),\n    cluster_nome:String(row.cluster_nome||'Moderada'),\n    generated_at:String(row.generated_at||''),\n    h4:row.h4 ?? null,\n    h5:row.h5 ?? null,\n    h6:row.h6 ?? null,\n    hier_peso:toNumber(row.hier_peso,1),\n    pred_p50_hier:toNumber(row.pred_p50_hier ?? predP50),\n    pred_p10_hier:toNumber(row.pred_p10_hier ?? predP10),\n    pred_p90_hier:toNumber(row.pred_p90_hier ?? predP90),\n    occupancy_pct_hier:toNumber(row.occupancy_pct_hier ?? occupancy),\n    real:row.real==null?null:toNumber(row.real),\n    pct_real:row.pct_real==null?null:toNumber(row.pct_real),\n    erro_abs:row.erro_abs==null?null:toNumber(row.erro_abs),\n    smape:row.smape==null?null:toNumber(row.smape),\n    na_faixa:String(row.na_faixa||''),\n    smape_treino:row.smape_treino==null?null:toNumber(row.smape_treino)\n  };\n}\n\nconst APICE_DATA=APICE_DATA_LISTA.map(normalizeApiceRecord).filter(r=>r.data&&r.capacidade>0&&r.building_id);\nconst APICE_EMPTY=!APICE_DATA.length;\n\nconst BUILDINGS_CONFIG=Array.from(APICE_DATA.reduce((map,d)=>{\n  if(!map.has(d.building_id))map.set(d.building_id,{id:d.building_id,nome:d.building_nome,short:d.building_short,floorMap:new Map()});\n  const b=map.get(d.building_id);\n  if(!b.floorMap.has(d.andar))b.floorMap.set(d.andar,{a:d.andar,cap:d.capacidade,cl:d.cluster_nome,occ:d.occupancy_pct_andar/100,vol:.12,mae:d.mae_modelo,sm:d.smape_modelo});\n  return map;\n},new Map()).values()).map(b=>({\n  id:b.id,nome:b.nome,short:b.short,\n  floors:Array.from(b.floorMap.values()).sort((a,b)=>String(a.a).localeCompare(String(b.a),'pt-BR',{numeric:true}))\n}));\n\nconst FORECAST_DATES=[...new Set(APICE_DATA.map(d=>d.data).filter(Boolean))].sort();\nconst DATE_INFO=FORECAST_DATES.reduce((acc,d)=>{\n  const rec=APICE_DATA.find(x=>x.data===d)||{};\n  const shortDay={'Domingo':'Dom','Segunda-feira':'Seg','Terça-feira':'Ter','Quarta-feira':'Qua','Quinta-feira':'Qui','Sexta-feira':'Sex','Sábado':'Sáb'}[rec.dia_semana]||rec.dia_semana||'';\n  acc[d]=[shortDay,rec.dia_semana_num||0];\n  return acc;\n},{});\n\nconst S={tab:'exec',filters:{date:'',building:'',floor:'',level:''},alertFilter:'all',\n  simBuilding:BUILDINGS_CONFIG[0]?.id||'',simDate:FORECAST_DATES[1]||FORECAST_DATES[0]||'',simAdj:0,charts:{},\n  viewBuilding:'',three:null,winType:'manut',pendingFocus:null,stressPct:10,tmSel:null,tmH4:'',tmH5:'',tmH6:'',tmCls:''};\nconst TAB_IDS=['exec','alerts','strategy','buildings','precision','simulator'];\n\n/* HELPERS */\nfunction sameValue(a,b){\n  const av=String(a ?? '').trim(),bv=String(b ?? '').trim();\n  if(av===bv)return true;\n  if(av&&bv){\n    const an=Number(av),bn=Number(bv);\n    if(Number.isFinite(an)&&Number.isFinite(bn))return an===bn;\n  }\n  return false;\n}\nfunction filtered(){\n  return APICE_DATA.filter(d=>{\n    if(S.filters.date&&!sameValue(d.data,S.filters.date))return false;\n    if(S.filters.building&&!sameValue(d.building_id,S.filters.building))return false;\n    if(S.filters.floor&&!sameValue(d.andar,S.filters.floor))return false;\n    if(S.filters.level&&!sameValue(d.alerta_nivel,S.filters.level))return false;\n    return true;\n  });\n}\nfunction kpis(data){\n  if(!data.length)return{avgPct:0,totalPrev:'0',criticos:0,atencao:0,confiab:0};\n  const n=data.length;\n  return{\n    avgPct:(data.reduce((s,d)=>s+d.occupancy_pct_andar,0)/n).toFixed(1),\n    totalPrev:data.reduce((s,d)=>s+d.pred_p50_andar,0).toLocaleString('pt-BR'),\n    criticos:data.filter(d=>d.alerta_nivel==='CRITICO').length,\n    atencao:data.filter(d=>d.alerta_nivel==='ATENCAO').length,\n    confiab:Math.round(Math.max(0,100-data.reduce((s,d)=>s+d.smape_modelo,0)/n)),\n  };\n}\nfunction portfolioStats(data){\n  if(!data.length)return{floors:0,buildings:0,cap:0,base:0,max:0,excess:0,spare:0,peak:null,critBuildings:0,riskScore:0,vol:0};\n  const uniqueFloor=new Map(),uniqueBuilding=new Set(),byDate={},critB=new Set();\n  data.forEach(d=>{\n    const key=`${d.floor_id}_${d.data}`;\n    uniqueFloor.set(key,d);\n    uniqueBuilding.add(d.building_id);\n    if(!byDate[d.data])byDate[d.data]={base:0,cap:0,max:0,crit:0,n:0};\n    byDate[d.data].base+=d.pred_p50_andar;\n    byDate[d.data].cap+=d.capacidade;\n    byDate[d.data].max+=d.pred_p90_andar;\n    byDate[d.data].n++;\n    if(d.alerta_nivel==='CRITICO'){byDate[d.data].crit++;critB.add(d.building_id);}\n  });\n  const recs=[...uniqueFloor.values()];\n  const cap=recs.reduce((s,d)=>s+d.capacidade,0);\n  const base=recs.reduce((s,d)=>s+d.pred_p50_andar,0);\n  const max=recs.reduce((s,d)=>s+d.pred_p90_andar,0);\n  const excess=recs.reduce((s,d)=>s+Math.max(0,d.pred_p50_andar-d.capacidade),0);\n  const spare=recs.reduce((s,d)=>s+Math.max(0,d.capacidade-d.pred_p50_andar),0);\n  const vol=recs.filter(d=>d.cluster_nome==='Volátil').length;\n  const peak=Object.entries(byDate).map(([date,v])=>({date,...v,pct:v.cap?Math.round((v.base/v.cap)*1000)/10:0}))\n    .sort((a,b)=>b.pct-a.pct)[0];\n  const crit=data.filter(d=>d.alerta_nivel==='CRITICO').length;\n  const att=data.filter(d=>d.alerta_nivel==='ATENCAO').length;\n  const riskScore=Math.min(100,Math.round((crit*2.4+att*1.1+vol*.55)/Math.max(1,data.length)*100));\n  return{floors:recs.length,buildings:uniqueBuilding.size,cap,base,max,excess,spare,peak,critBuildings:critB.size,riskScore,vol};\n}\nfunction execDailyKpis(data){\n  if(!data.length)return{days:0,multi:false,people:0,cap:0,excess:0,max:0,spare:0,peakDate:null,maxOcc:0,maxOccDate:null,maxOccLabel:''};\n  const byDate={};\n  data.forEach(d=>{\n    if(!byDate[d.data])byDate[d.data]={date:d.data,people:0,cap:0,max:0,excess:0,spare:0};\n    const x=byDate[d.data];\n    x.people+=d.pred_p50_andar;\n    x.cap+=d.capacidade;\n    x.max+=d.pred_p90_andar;\n    x.excess+=Math.max(0,d.pred_p50_andar-d.capacidade);\n    x.spare+=Math.max(0,d.capacidade-d.pred_p50_andar);\n  });\n  const days=Object.values(byDate);\n  const avg=k=>Math.round(days.reduce((sum,d)=>sum+d[k],0)/Math.max(1,days.length));\n  const peak=days.slice().sort((a,b)=>b.max-a.max)[0];\n  const worst=days.slice().sort((a,b)=>b.excess-a.excess)[0];\n  const maxOccPoint=data.slice().sort((a,b)=>b.occupancy_pct_andar-a.occupancy_pct_andar)[0];\n  return{\n    days:days.length,\n    multi:days.length>1,\n    people:days.length>1?avg('people'):days[0].people,\n    cap:days.length>1?avg('cap'):days[0].cap,\n    excess:days.length>1?worst.excess:days[0].excess,\n    max:peak.max,\n    spare:days.length>1?avg('spare'):days[0].spare,\n    peakDate:peak.date,\n    excessDate:worst.date,\n    maxOcc:Math.round(maxOccPoint.occupancy_pct_andar*10)/10,\n    maxOccDate:maxOccPoint.data,\n    maxOccLabel:`${maxOccPoint.building_short||maxOccPoint.building_nome} · ${maxOccPoint.andar}`\n  };\n}\nfunction bstats(data){\n  const m={};\n  data.forEach(d=>{\n    if(!m[d.building_id])m[d.building_id]={id:d.building_id,nome:d.building_nome,short:d.building_short,pcts:[],crit:0};\n    m[d.building_id].pcts.push(d.occupancy_pct_andar);\n    if(d.alerta_nivel==='CRITICO')m[d.building_id].crit++;\n  });\n  return Object.values(m).map(b=>{b.avg=b.pcts.reduce((s,v)=>s+v,0)/b.pcts.length;return b;}).sort((a,b)=>b.avg-a.avg);\n}\nfunction fd(s){if(!s)return'';const[y,m,d]=s.split('-');return`${d}/${m}`;}\nfunction cc(p){return p>=90?'red':p>=80?'amb':'grn';}\nfunction nlbl(n){return n==='CRITICO'?'Crítico':n==='ATENCAO'?'Atenção':'Normal';}\nfunction pct(n){return `${Number(n).toFixed(1)}%`;}\nfunction clbadge(cl){\n  const map={'Alta Ocupação':'alta','Volátil':'vol','Moderada':'mod','Baixa Ocupação':'baixa'};\n  return `<span class=\"cbadge ${map[cl]||''}\">${cl}<\/span>`;\n}\nfunction fallbackBars(labels,values,color='#00B8F1'){\n  const max=Math.max(...values.map(v=>Number(v)),1);\n  return `<div class=\"fallback-chart\">${labels.map((l,i)=>{\n    const h=Math.max(18,Math.round(Number(values[i])/max*100));\n    return `<div class=\"fb-col\"><div class=\"fb-bar\" style=\"height:${h}%;background:${color}\"><\/div><div class=\"fb-label\">${l}<\/div><\/div>`;\n  }).join('')}<\/div>`;\n}\nfunction fallbackDonut(labels,values,colors=['#D93025','#E37400','#1E8E3E']){\n  const total=values.reduce((s,v)=>s+v,0)||1;\n  let acc=0;\n  const stops=values.map((v,i)=>{\n    const start=acc/total*100;acc+=v;const end=acc/total*100;\n    return `${colors[i]} ${start}% ${end}%`;\n  }).join(',');\n  return `<div class=\"fallback-donut\"><div class=\"fb-ring\" style=\"background:conic-gradient(${stops})\"><\/div><div class=\"fb-legend\">${labels.map((l,i)=>`<span><i style=\"background:${colors[i]}\"><\/i>${l}: <strong>${values[i]}<\/strong><\/span>`).join('')}<\/div><\/div>`;\n}\n\n/* ===== INTEL — camadas de inteligência derivadas exclusivamente do JSON carregado ===== */\nconst INTEL={_c:{}};\nINTEL.memo=function(k,fn){if(!(k in this._c))this._c[k]=fn();return this._c[k];};\nconst capPct=(n,cap)=>cap>0?n/cap*100:0;\nconst rnd1=v=>Math.round(v*10)/10;\nconst fdia=d=>DATE_INFO[d]?.[0]||'';\nconst fdd=d=>`${fd(d)} (${fdia(d)})`;\nfunction andarLbl(a){const n=Number(a);return Number.isFinite(n)?`${n}º andar`:`Andar ${a}`;}\n\n/* Confiança do alerta (ideia original): triagem por certeza usando P10/P50/P90 */\nINTEL.confidence=function(rec){\n  const cap=rec.capacidade;\n  const th=rec.alerta_nivel==='CRITICO'?90:80;\n  const p10=capPct(rec.pred_p10_andar,cap),p50=capPct(rec.pred_p50_andar,cap),p90=capPct(rec.pred_p90_andar,cap);\n  const band=rnd1(p90-p10);\n  if(p10>=th)return{cls:'c1',label:'Confirmado',band,desc:`Mesmo no cenário mínimo (P10) a ocupação fica em ${rnd1(p10)}%. O alerta é consistente em todos os cenários: agir.`};\n  if(p50>=th)return{cls:'c2',label:'Provável',band,desc:`O cenário central (P50) atinge ${rnd1(p50)}%, mas o mínimo (P10) fica em ${rnd1(p10)}%. Preparar a ação e confirmar na véspera.`};\n  return{cls:'c3',label:'Possível',band,desc:`Apenas o cenário máximo (P90, ${rnd1(p90)}%) cruza o limite. Monitorar sem mobilização antecipada.`};\n};\nINTEL.confSummary=function(){return this.memo('confsum',()=>{\n  const c={total:0,c1:0,c2:0,c3:0};\n  APICE_DATA.forEach(r=>{if(r.alerta_nivel!=='CRITICO')return;c.total++;c[INTEL.confidence(r).cls]++;});\n  return c;});};\n\nINTEL.series=function(){return this.memo('series',()=>{\n  const m=new Map();\n  APICE_DATA.forEach(r=>{if(!m.has(r.floor_id))m.set(r.floor_id,[]);m.get(r.floor_id).push(r);});\n  m.forEach(a=>a.sort((x,y)=>x.data<y.data?-1:x.data>y.data?1:0));\n  return m;});};\n\n/* Alertas emergentes: saltos dia-a-dia, proximidade do limite e data provável de criticidade */\nINTEL.emerging=function(){return this.memo('emerging',()=>{\n  const out=[];const seen=new Set();\n  this.series().forEach(arr=>{\n    for(let i=1;i<arr.length;i++){\n      const a=arr[i-1],b=arr[i];\n      const delta=rnd1(b.occupancy_pct_andar-a.occupancy_pct_andar);\n      const to=b.occupancy_pct_andar;\n      if(delta<10||to<70)continue;\n      const future=arr.slice(i+1);\n      const firstCrit=future.find(r=>r.occupancy_pct_andar>=90);\n      let proj=null,projKind=null,projD=null;\n      if(to<90){\n        if(firstCrit){proj=firstCrit.data;projKind='data';}\n        else if(delta>0&&!future.length){const days=Math.ceil((90-to)/delta);if(days<=3){projKind='trend';projD=days;}}\n      }\n      const sev=to>=90?'red':(to>=83||delta>=18)?'amb':'blu';\n      out.push({type:'salto',rec:b,prev:a,from:a.occupancy_pct_andar,to,delta,sev,proj,projKind,projD,already:to>=90,score:to+delta*1.4});\n      seen.add(b.floor_id);\n    }\n  });\n  this.series().forEach(arr=>{\n    if(arr.some(r=>r.alerta_nivel==='CRITICO'))return;\n    const peak=arr.slice().sort((x,y)=>y.occupancy_pct_andar-x.occupancy_pct_andar)[0];\n    if(peak&&peak.occupancy_pct_andar>=84&&!seen.has(peak.floor_id))\n      out.push({type:'limite',rec:peak,prev:null,from:null,to:peak.occupancy_pct_andar,delta:null,sev:'amb',proj:null,projKind:null,projD:null,already:false,score:peak.occupancy_pct_andar});\n  });\n  out.sort((x,y)=>y.score-x.score);\n  return out;});};\n\n/* Aceleração por prédio: maior elevação média entre dias consecutivos */\nINTEL.acceleration=function(){return this.memo('accel',()=>{\n  const bmap=new Map();\n  APICE_DATA.forEach(r=>{\n    if(!bmap.has(r.building_id))bmap.set(r.building_id,{id:r.building_id,short:r.building_short,nome:r.building_nome,byDate:{}});\n    (bmap.get(r.building_id).byDate[r.data]=bmap.get(r.building_id).byDate[r.data]||[]).push(r.occupancy_pct_andar);\n  });\n  const out=[];\n  bmap.forEach(b=>{\n    const dates=Object.keys(b.byDate).sort();let best=null;\n    for(let i=1;i<dates.length;i++){\n      const pa=b.byDate[dates[i-1]].reduce((s,v)=>s+v,0)/b.byDate[dates[i-1]].length;\n      const ca=b.byDate[dates[i]].reduce((s,v)=>s+v,0)/b.byDate[dates[i]].length;\n      const d=rnd1(ca-pa);\n      if(!best||d>best.delta)best={from:dates[i-1],to:dates[i],fromPct:rnd1(pa),toPct:rnd1(ca),delta:d};\n    }\n    if(best)out.push({id:b.id,short:b.short,nome:b.nome,...best});\n  });\n  out.sort((a,b)=>b.delta-a.delta);\n  return out;});};\n\n/* Redistribuição: origem crítica -> destinos seguros (P50 alvo + verificação P90) */\nINTEL.plans=function(){return this.memo('plans',()=>{\n  const T={origem:.85,dest50:.80,dest90:.95,min:5};\n  const byDate=new Map();\n  APICE_DATA.forEach(r=>{if(!byDate.has(r.data))byDate.set(r.data,[]);byDate.get(r.data).push(r);});\n  const plans=[];\n  [...byDate.keys()].sort().forEach(date=>{\n    const rows=byDate.get(date);\n    rows.filter(r=>r.alerta_nivel==='CRITICO'&&r.capacidade>0)\n      .sort((a,b)=>b.occupancy_pct_andar-a.occupancy_pct_andar)\n      .forEach(origin=>{\n        const excess=origin.pred_p50_andar-Math.floor(origin.capacidade*T.origem);\n        if(excess<T.min)return;\n        const cands=rows.filter(r=>r.floor_id!==origin.floor_id&&r.capacidade>0).map(r=>{\n          const room=Math.max(0,Math.min(Math.floor(r.capacidade*T.dest50)-r.pred_p50_andar,Math.floor(r.capacidade*T.dest90)-r.pred_p90_andar));\n          return{rec:r,room,same:r.building_id===origin.building_id};\n        }).filter(c=>c.room>=T.min);\n        const rank=c=>c.room-(c.rec.cluster_nome==='Volátil'?18:0);\n        const sames=cands.filter(c=>c.same).sort((a,b)=>rank(b)-rank(a));\n        const others=cands.filter(c=>!c.same).sort((a,b)=>rank(b)-rank(a));\n        const moves=[];let rem=excess;\n        const single=sames.find(c=>c.room>=rem);\n        if(single){moves.push({c:single,qty:rem});rem=0;}\n        else{\n          for(const c of sames){if(rem<=0||moves.length>=3)break;const q=Math.min(c.room,rem);if(q>=T.min){moves.push({c,qty:q});rem-=q;}}\n          if(rem>=T.min&&moves.length<3){\n            const singleO=others.find(c=>c.room>=rem);\n            if(singleO){moves.push({c:singleO,qty:rem});rem=0;}\n            else for(const c of others){if(rem<T.min||moves.length>=3)break;const q=Math.min(c.room,rem);if(q>=T.min){moves.push({c,qty:q});rem-=q;}}\n          }\n        }\n        const moved=excess-rem;\n        const used=new Set(moves.map(m=>m.c));\n        plans.push({\n          id:'pl'+plans.length,date,origin,excess,moved,residual:rem,\n          absorb:excess>0?Math.round(moved/excess*100):0,\n          oBefore:origin.occupancy_pct_andar,\n          oAfter:rnd1(capPct(origin.pred_p50_andar-moved,origin.capacidade)),\n          oAfter90:rnd1(capPct(origin.pred_p90_andar-moved,origin.capacidade)),\n          cross:moves.some(m=>!m.c.same),\n          moves:moves.map(m=>({rec:m.c.rec,qty:m.qty,same:m.c.same,room:m.c.room,\n            before:m.c.rec.occupancy_pct_andar,\n            after:rnd1(capPct(m.c.rec.pred_p50_andar+m.qty,m.c.rec.capacidade)),\n            after90:rnd1(capPct(m.c.rec.pred_p90_andar+m.qty,m.c.rec.capacidade))})),\n          alts:[...sames,...others].filter(c=>!used.has(c)).slice(0,2).map(c=>({rec:c.rec,room:c.room,same:c.same})),\n          conf:INTEL.confidence(origin)\n        });\n      });\n  });\n  plans.sort((a,b)=>b.excess-a.excess);\n  return plans;});};\n\n/* Concentração de risco (Pareto por prédio) */\nINTEL.concentration=function(){return this.memo('conc',()=>{\n  const crit=APICE_DATA.filter(r=>r.alerta_nivel==='CRITICO');\n  const base=crit.length?crit:APICE_DATA.filter(r=>r.alerta_nivel==='ATENCAO');\n  const mode=crit.length?'CRITICO':'ATENCAO';\n  const m=new Map();\n  base.forEach(r=>{\n    if(!m.has(r.building_id))m.set(r.building_id,{id:r.building_id,nome:r.building_nome,short:r.building_short,n:0,floors:new Set(),days:new Set(),excess:0});\n    const b=m.get(r.building_id);b.n++;b.floors.add(r.andar);b.days.add(r.data);b.excess+=Math.max(0,r.pred_p50_andar-r.capacidade);\n  });\n  const total=base.length||1;\n  const arr=[...m.values()].sort((a,b)=>b.n-a.n).map(b=>({id:b.id,nome:b.nome,short:b.short,n:b.n,excess:b.excess,floors:b.floors.size,days:b.days.size,share:b.n/total}));\n  let cum=0;arr.forEach(b=>{cum+=b.share;b.cum=cum;});\n  const top2=arr.slice(0,2).reduce((s,b)=>s+b.share,0);\n  const top3=arr.slice(0,3).reduce((s,b)=>s+b.share,0);\n  const verdict=arr.length<=2?'alta':top2>=.66?'alta':top2>=.40?'media':'baixa';\n  return{mode,total:base.length,arr,top2,top3,verdict};});};\n\n/* Agregados prédio×dia e janelas operacionais */\nINTEL.buildingDays=function(){return this.memo('bdays',()=>{\n  const m=new Map();\n  APICE_DATA.forEach(r=>{\n    const k=r.building_id+'|'+r.data;\n    if(!m.has(k))m.set(k,{bid:r.building_id,short:r.building_short,nome:r.building_nome,date:r.data,p50:0,p90:0,p10:0,cap:0,n:0,crit:0,att:0});\n    const x=m.get(k);x.p50+=r.pred_p50_andar;x.p90+=r.pred_p90_andar;x.p10+=r.pred_p10_andar;x.cap+=r.capacidade;x.n++;\n    if(r.alerta_nivel==='CRITICO')x.crit++;else if(r.alerta_nivel==='ATENCAO')x.att++;\n  });\n  return [...m.values()].map(x=>({...x,occ:rnd1(capPct(x.p50,x.cap)),occ90:rnd1(capPct(x.p90,x.cap)),free:Math.max(0,x.cap-x.p50),free90:Math.max(0,x.cap-x.p90),spread:rnd1(capPct(x.p90-x.p10,x.cap))}));\n});};\nINTEL.windows=function(type){return this.memo('win_'+type,()=>{\n  if(type==='building')\n    return this.buildingDays().filter(x=>x.crit===0).sort((a,b)=>a.occ-b.occ).slice(0,9).map(x=>({...x,safe:x.occ90<=55}));\n  if(type==='floorclose'){\n    const byBD=new Map();\n    APICE_DATA.forEach(r=>{const k=r.building_id+'|'+r.data;if(!byBD.has(k))byBD.set(k,[]);byBD.get(k).push(r);});\n    const out=[];\n    byBD.forEach(rows=>{\n      if(rows.length<2)return;\n      const totP50=rows.reduce((s,r)=>s+r.pred_p50_andar,0);\n      rows.forEach(r=>{\n        const restCap=rows.reduce((s,x)=>s+(x===r?0:x.capacidade),0);\n        if(restCap<=0)return;\n        const afterRest=capPct(totP50,restCap);\n        if(afterRest<=85)out.push({rec:r,afterRest:rnd1(afterRest),beforeRest:rnd1(capPct(totP50-r.pred_p50_andar,restCap))});\n      });\n    });\n    out.sort((a,b)=>a.afterRest-b.afterRest);\n    return out.slice(0,9);\n  }\n  if(type==='clean')\n    return APICE_DATA.filter(r=>r.capacidade>0).slice().sort((a,b)=>a.occupancy_pct_andar-b.occupancy_pct_andar).slice(0,9).map(r=>({rec:r,occ90:rnd1(capPct(r.pred_p90_andar,r.capacidade))}));\n  if(type==='event')\n    return APICE_DATA.filter(r=>r.capacidade>0&&r.occupancy_pct_andar<=65)\n      .map(r=>({rec:r,free90:Math.max(0,r.capacidade-r.pred_p90_andar)})).filter(x=>x.free90>=10)\n      .sort((a,b)=>b.free90-a.free90).slice(0,9);\n  return [];});};\n\n/* Custo da inação: pessoa-dias acima da capacidade e quanto as redistribuições resolvem */\nINTEL.inaction=function(){return this.memo('inaction',()=>{\n  let tot=0,pts=0;const days=new Set(),flo=new Set();\n  APICE_DATA.forEach(r=>{const e=Math.max(0,r.pred_p50_andar-r.capacidade);if(e>0){tot+=e;pts++;days.add(r.data);flo.add(r.floor_id);}});\n  let solved=0;\n  this.plans().forEach(p=>{solved+=Math.min(p.moved,Math.max(0,p.origin.pred_p50_andar-p.origin.capacidade));});\n  return{tot,pts,days:days.size,floors:flo.size,solved,after:Math.max(0,tot-solved)};});};\n\n/* Navegação contextual */\nfunction goToBuilding(bid){\n  const ov=document.getElementById('modal-ov');if(ov)ov.classList.remove('open');\n  const r3=document.getElementById('r3d-ov');if(r3&&r3.classList.contains('open'))closeR3D();\n  if(S.filters.building&&S.filters.building!==bid){S.filters.building=bid;const sel=document.getElementById('f-bld');if(sel)sel.value=bid;updateFloorOptions();}\n  S.viewBuilding=bid;\n  switchTab('buildings');\n}\nfunction goToBuildingFloor(bid,andar){\n  S.pendingFocus=String(andar);\n  goToBuilding(bid);\n}\nfunction toggleDcard(id){const el=document.getElementById(id);if(el)el.classList.toggle('open');}\nfunction openPlanFromModal(planId){document.getElementById('modal-ov').classList.remove('open');openPlan3D(planId);}\n\n/* RENDER EXEC */\nfunction renderExec(){\n  const data=filtered(),K=kpis(data),P=portfolioStats(data),E=execDailyKpis(data),bs=bstats(data);\n  const crit=data.filter(d=>d.alerta_nivel==='CRITICO');\n  const low=data.filter(d=>d.occupancy_pct_andar<50);\n  const peak=data.filter(d=>d.occupancy_pct_andar>85);\n  const byDate={};\n  data.forEach(d=>{\n    if(!byDate[d.data])byDate[d.data]={p10:0,p50:0,p90:0,cap:0,n:0};\n    byDate[d.data].p10+=d.pred_p10_andar;\n    byDate[d.data].p50+=d.pred_p50_andar;\n    byDate[d.data].p90+=d.pred_p90_andar;\n    byDate[d.data].cap+=d.capacidade;\n    byDate[d.data].n++;\n  });\n  const trendDates=Object.keys(byDate).sort();\n  const trendPts=trendDates.map(dt=>({\n    date:dt,\n    central:byDate[dt].cap?Math.round(byDate[dt].p50/byDate[dt].cap*1000)/10:0,\n    min:byDate[dt].cap?Math.round(byDate[dt].p10/byDate[dt].cap*1000)/10:0,\n    max:byDate[dt].cap?Math.round(byDate[dt].p90/byDate[dt].cap*1000)/10:0,\n    people:byDate[dt].p50,\n    capacity:byDate[dt].cap\n  }));\n  const trendPeak=trendPts.slice().sort((a,b)=>b.central-a.central)[0];\n  const trendLow=trendPts.slice().sort((a,b)=>a.central-b.central)[0];\n  const trendDelta=trendPeak&&trendLow?Math.round((trendPeak.central-trendLow.central)*10)/10:0;\n  const levelCounts={\n    CRITICO:data.filter(d=>d.alerta_nivel==='CRITICO').length,\n    ATENCAO:data.filter(d=>d.alerta_nivel==='ATENCAO').length,\n    NORMAL:data.filter(d=>d.alerta_nivel==='NORMAL').length\n  };\n  const levelTotal=Math.max(1,data.length);\n  const levelRows=[\n    {key:'CRITICO',label:'Crítico',color:'#D93025',hint:'acima de 90%'},\n    {key:'ATENCAO',label:'Atenção',color:'#E37400',hint:'entre 80% e 90%'},\n    {key:'NORMAL',label:'Normal',color:'#1E8E3E',hint:'abaixo de 80%'}\n  ];\n  const overload=crit.reduce((s,d)=>s+Math.max(0,d.pred_p50_andar-d.capacidade),0);\n  const bestB=bs.length?[...bs].reverse().find(b=>b.avg<65)||bs[bs.length-1]:null;\n  const topB=bs[0]||null;\n  const ins=[];\n  if(crit.length)ins.push({t:'red',txt:`<strong>${crit.length} zonas críticas<\/strong> acima de 90%. Ação recomendada: redistribuir fluxo antes do pico e priorizar comunicação aos times desses andares.`});\n  if(peak.length)ins.push({t:'amb',txt:`<strong>${peak.length} andares acima de 85%<\/strong>. Manter monitoramento ativo e preparar reforço de elevadores, limpeza e recepção.`});\n  if(overload>0)ins.push({t:'org',txt:`O cenário central aponta <strong>${overload.toLocaleString('pt-BR')} pessoas acima da capacidade<\/strong> em pontos específicos. Tratar como frente de contingência.`});\n  if(P.peak)ins.push({t:'blu',txt:`Dia de maior pressão: <strong>${fd(P.peak.date)} (${DATE_INFO[P.peak.date][0]})<\/strong>, com ${P.peak.pct}% de uso médio e ${P.peak.crit} alertas críticos.`});\n  if(low.length)ins.push({t:'grn',txt:`<strong>${low.length} zonas abaixo de 50%<\/strong> podem ser usadas para realocação de equipes, manutenção preventiva ou consolidação de espaço.`});\n  if(typeof HIER_AVAILABLE!=='undefined'&&HIER_AVAILABLE){const hx=HIER_INTEL.exposure(),hc=HIER_INTEL.critDep();if(hx.teams.length)ins.push({t:'blu',txt:`<strong>${hx.teams.length} equipe${ EL__;\n    if(window.__APICE_HIER_ERRO__)console.warn('[ÁPICE] Bloco de hierarquia inválido — camada desativada:',window.__APICE_HIER_ERRO__);\n    if(!raw||typeof raw!=='object')return;\n    const FLOORKEY=new Map();APICE_DATA.forEach(r=>{if(!FLOORKEY.has(r.building_id+'|'+apiceSlug(r.andar)))FLOORKEY.set(r.building_id+'|'+apiceSlug(r.andar),r.floor_id);});\n    const BSHORT=new Map();BUILDINGS_CONFIG.forEach(b=>BSHORT.set(b.id,b.short));\n    function matchB(torre){\n      const s=apiceSlug(torre);if(!s)return null;\n      const cand=HIER_BUILDING_ALIASES[s]?apiceSlug(HIER_BUILDING_ALIASES[s]):s;\n      for(const b of BUILDINGS_CONFIG){const ids=[b.id,apiceSlug(b.nome),apiceSlug(b.short)];if(ids.includes(s)||ids.includes(cand))return b.id;}\n      for(const b of BUILDINGS_CONFIG){const ids=[b.id,apiceSlug(b.nome),apiceSlug(b.short)].filter(Boolean);if(ids.some(x=>x.includes(cand)||cand.includes(x)||x.includes(s)||s.includes(x)))return b.id;}\n      return null;\n    }\n    function normShare(v){const n=Number(v);if(!Number.isFinite(n)||n<0)return null;return n>1.5?n/100:n;}\n    function cleanRow(r,who){\n      const h6=String(r.h6??'').trim();\n      if(!h6||apiceSlug(h6)==='nao_identificado')return null;\n      const torre=String(r.torre??'').trim();\n      const andar=String(r.andar??'').trim();\n      const bid=matchB(torre);\n      const andarK=apiceSlug(andar)||'sem_andar';\n      const floorId=bid?(FLOORKEY.get(bid+'|'+andarK)||null):null;\n      const lk=(bid||'?'+apiceSlug(torre))+'|'+andarK;\n      if(!HIER_LOCLABEL.has(lk))HIER_LOCLABEL.set(lk,{bLabel:bid?BSHORT.get(bid):torre||'—',andar:andar||'—',bid,floorId});\n      return{h6,h6k:apiceSlug(h6),h5:String(r.h5??'').trim(),h4:String(r.h4??'').trim(),torre,andar,andarK,bid,floorId,lk};\n    }\n    if(Array.isArray(raw.perfil_local))raw.perfil_local.forEach(r=>{\n      if(!r||typeof r!=='object')return;\n      const c=cleanRow(r,'p');if(!c)return;\n      let pd=Number(r.pessoa_dias);\n      const sh=normShare(r.share_andar);\n      if(!Number.isFinite(pd)||pd<0)pd=sh!=null?Math.max(1,Math.round(sh*100)):0;\n      if(pd<=0)return;\n      c.pd=pd;\n      if(!c.bid)HIER_UNMATCHED_PD+=pd;\n      HIER_PROFILE_DATA.push(c);\n    });\n    if(Array.isArray(raw.tendencia_semanal))raw.tendencia_semanal.forEach(r=>{\n      if(!r||typeof r!=='object')return;\n      const c=cleanRow(r,'t');if(!c)return;\n      const d=new Date(r.semana);\n      if(isNaN(d.getTime()))return;\n      c.semana=d.toISOString().slice(0,10);\n      c.pessoas=Math.max(0,Number(r.pessoas_distintas)||0);\n      if(!c.pessoas)return;\n      HIER_TREND_DATA.push(c);\n    });\n    // h5/h4 ausentes na tendência: associar via perfil\n    const h5by=new Map(),h4by=new Map();\n    HIER_PROFILE_DATA.forEach(r=>{if(r.h5&&!h5by.has(r.h6k))h5by.set(r.h6k,r.h5);if(r.h4&&!h4by.has(r.h6k))h4by.set(r.h6k,r.h4);});\n    HIER_TREND_DATA.forEach(r=>{if(!r.h5)r.h5=h5by.get(r.h6k)||'';if(!r.h4)r.h4=h4by.get(r.h6k)||'';});\n  }catch(e){\n    console.warn('[ÁPICE] Falha ao processar hierarquia — camada desativada:',e.message);\n    HIER_PROFILE_DATA=[];HIER_TREND_DATA=[];\n  }\n})();\nconst HIER_PROFILE_AVAILABLE=HIER_PROFILE_DATA.length>0;\nconst HIER_TREND_AVAILABLE=HIER_TREND_DATA.length>0;\nconst HIER_AVAILABLE=HIER_PROFILE_AVAILABLE||HIER_TREND_AVAILABLE;\n\nconst HIER_INTEL={_c:{}};\nHIER_INTEL.memo=function(k,fn){if(!(k in this._c))this._c[k]=fn();return this._c[k];};\nHIER_INTEL.locLabel=function(lk){const l=HIER_LOCLABEL.get(lk);return l?`${l.bLabel} · ${andarLbl(l.andar)}`:lk;};\nHIER_INTEL.teams=function(){return this.memo('teams',()=>{\n  const tmap=new Map();\n  const ensure=(k,h6,h5,h4)=>{if(!tmap.has(k))tmap.set(k,{key:k,h6,h5:h5||'',h4:h4||'',pd:0,locs:new Map(),fromTrend:false});const t=tmap.get(k);if(!t.h5&&h5)t.h5=h5;if(!t.h4&&h4)t.h4=h4;return t;};\n  HIER_PROFILE_DATA.forEach(r=>{\n    const t=ensure(r.h6k,r.h6,r.h5,r.h4);\n    t.pd+=r.pd;\n    if(!t.locs.has(r.lk))t.locs.set(r.lk,{lk:r.lk,bid:r.bid,torre:r.torre,andar:r.andar,floorId:r.floorId,matched:!!r.floorId,pd:0});\n    t.locs.get(r.lk).pd+=r.pd;\n  });\n  if(!HIER_PROFILE_AVAILABLE)HIER_TREND_DATA.forEach(r=>{\n    const t=ensure(r.h6k,r.h6,r.h5,r.h4);t.fromTrend=true;t.pd+=r.pessoas;\n    if(!t.locs.has(r.lk))t.locs.set(r.lk,{lk:r.lk,bid:r.bid,torre:r.torre,andar:r.andar,floorId:r.floorId,matched:!!r.floorId,pd:0});\n    t.locs.get(r.lk).pd+=r.pessoas;\n  });\n  tmap.forEach(t=>{\n    t.locs=[...t.locs.values()].sort((a,b)=>b.pd-a.pd);\n    const tot=t.locs.reduce((s,l)=>s+l.pd,0)||1;\n    t.locs.forEach(l=>{l.share=l.pd/tot;l.label=HIER_INTEL.locLabel(l.lk);});\n    t.dom=t.locs[0]||null;\n    t.domShare=t.dom?t.dom.share:0;\n    t.nB=new Set(t.locs.map(l=>l.bid||l.torre)).size;\n    t.nF=t.locs.length;\n    t.effLoc=1/Math.max(1e-9,t.locs.reduce((s,l)=>s+l.share*l.share,0));\n    t.cls=t.domShare>=0.6?'fixa':(t.domShare>=0.35||(t.locs[1]&&t.locs[0].share+t.locs[1].share>=0.6))?'multibase':'distribuida';\n    t.cover=t.locs.reduce((s,l)=>s+(l.matched?l.pd:0),0)/tot;\n  });\n  return tmap;});};\nHIER_INTEL.teamList=function(){return this.memo('tlist',()=>[...this.teams().values()].sort((a,b)=>b.pd-a.pd));};\nHIER_INTEL.h5List=function(){return this.memo('h5s',()=>{\n  const m=new Map();\n  this.teamList().forEach(t=>{\n    const k=t.h5||'(sem H5)';\n    if(!m.has(k))m.set(k,{h5:k,h4:t.h4,teams:[],pd:0,builds:new Map()});\n    const h=m.get(k);h.teams.push(t);h.pd+=t.pd;\n    t.locs.forEach(l=>{const bk=l.bid||l.torre;h.builds.set(bk,(h.builds.get(bk)||0)+l.pd);});\n  });\n  return [...m.values()].sort((a,b)=>b.pd-a.pd);});};\nHIER_INTEL.coverage=function(){return this.memo('cover',()=>{\n  const tot=HIER_PROFILE_DATA.reduce((s,r)=>s+r.pd,0);\n  return{tot,pct:tot?Math.round((tot-HIER_UNMATCHED_PD)/tot*100):0};});};\nHIER_INTEL.trends=function(){return this.memo('trends',()=>{\n  const m=new Map();\n  HIER_TREND_DATA.forEach(r=>{\n    if(!m.has(r.h6k))m.set(r.h6k,new Map());\n    const wm=m.get(r.h6k);\n    if(!wm.has(r.semana))wm.set(r.semana,{semana:r.semana,pessoas:0,locs:new Map()});\n    const w=wm.get(r.semana);w.pessoas+=r.pessoas;\n    w.locs.set(r.lk,(w.locs.get(r.lk)||0)+r.pessoas);\n  });\n  const out=new Map();\n  m.forEach((wm,k)=>{\n    const weeks=[...wm.values()].sort((a,b)=>a.semana<b.semana?-1:1);\n    weeks.forEach(w=>{let best=null;w.locs.forEach((v,lk)=>{if(!best||v>best.v)best={lk,v};});w.dom=best?best.lk:null;w.domShare=best?best.v/Math.max(1,w.pessoas):0;});\n    const n=weeks.length;\n    const rN=Math.min(3,n);\n    const recent=weeks.slice(-rN).reduce((s,w)=>s+w.pessoas,0)/Math.max(1,rN);\n    const priorArr=weeks.slice(0,n-rN);\n    const prior=priorArr.length>=2?priorArr.reduce((s,w)=>s+w.pessoas,0)/priorArr.length:null;\n    const deltaPct=prior?rnd1((recent-prior)/prior*100):null;\n    const mean=weeks.reduce((s,w)=>s+w.pessoas,0)/Math.max(1,n);\n    const vol=n>1?Math.sqrt(weeks.reduce((s,w)=>s+Math.pow(w.pessoas-mean,2),0)/n)/Math.max(1,mean):0;\n    out.set(k,{weeks,n,recent:Math.round(recent),prior:prior?Math.round(prior):null,deltaPct,\n      dir:(n>=4&&deltaPct!=null)?(deltaPct>=15?'alta':deltaPct<=-15?'queda':'estavel'):'limitada',\n      vol:rnd1(vol*100),limited:n<4});\n  });\n  return out;});};\nHIER_INTEL.moves=function(){return this.memo('moves',()=>{\n  const out=[];\n  this.trends().forEach((tr,k)=>{\n    if(tr.n<3)return;\n    const team=this.teams().get(k);if(!team)return;\n    const seq=tr.weeks.map(w=>w.dom).filter(Boolean);\n    if(!seq.length)return;\n    const last=seq[seq.length-1];\n    let held=1;for(let i=seq.length-2;i>=0&&seq[i]===last;i--)held++;\n    const prevDom=seq.length>held?seq[seq.length-held-1]:(team.dom?team.dom.lk:null);\n    let changes=0;for(let i=Math.max(1,seq.length-5);i<seq.length;i++)if(seq[i]!==seq[i-1])changes++;\n    if(changes>=3){out.push({team,kind:'alternância',status:'alternância',txt:`O local dominante alternou ${changes} vezes nas últimas semanas — baixa estabilidade espacial.`});return;}\n    if(prevDom&&last!==prevDom&&held>=2){\n      const fromL=HIER_LOCLABEL.get(prevDom),toL=HIER_LOCLABEL.get(last);\n      const kind=(fromL&&toL&&fromL.bid&&toL.bid&&fromL.bid===toL.bid)?'andar':'prédio';\n      out.push({team,from:prevDom,to:last,fromBid:fromL?fromL.bid:null,toBid:toL?toL.bid:null,kind,held,\n        status:held>=3?'consolidada':'em curso',\n        txt:`Migrou de ${this.locLabel(prevDom)} para ${this.locLabel(last)} — novo local dominante há ${held} semana${held>1?'s':''} (${held>=3?'mudança consolidada':'em consolidação'}).`});\n    }\n  });\n  return out;});};\nHIER_INTEL.floorTeams=function(floorId){\n  const idx=this.memo('fidx',()=>{\n    const m=new Map();\n    this.teamList().forEach(t=>t.locs.forEach(l=>{\n      if(!l.floorId)return;\n      if(!m.has(l.floorId))m.set(l.floorId,[]);\n      m.get(l.floorId).push({team:t,loc:l,isDom:t.dom&&t.dom.lk===l.lk});\n    }));\n    m.forEach(arr=>{\n      arr.sort((a,b)=>b.loc.pd-a.loc.pd);\n      const tot=arr.reduce((s,x)=>s+x.loc.pd,0)||1;\n      arr.forEach(x=>x.comp=x.loc.pd/tot);\n    });\n    return m;});\n  return idx.get(floorId)||[];\n};\nHIER_INTEL.exposure=function(){return this.memo('expo',()=>{\n  const fRisk=new Map();\n  APICE_DATA.forEach(r=>{\n    if(r.alerta_nivel==='NORMAL')return;\n    const rank=r.alerta_nivel==='CRITICO'?2:1;\n    const cur=fRisk.get(r.floor_id);\n    if(!cur||rank>cur.rank)fRisk.set(r.floor_id,{rank,nivel:r.alerta_nivel});\n  });\n  const teams=[];\n  this.teamList().forEach(t=>{\n    const items=t.locs.filter(l=>l.floorId&&l.share>=0.2&&fRisk.has(l.floorId)).map(l=>({loc:l,nivel:fRisk.get(l.floorId).nivel}));\n    if(items.length)teams.push({team:t,items,worst:items.some(i=>i.nivel==='CRITICO')?'CRITICO':'ATENCAO',domHit:items.some(i=>t.dom&&i.loc.lk===t.dom.lk)});\n  });\n  teams.sort((a,b)=>(b.worst==='CRITICO')-(a.worst==='CRITICO')||b.team.pd-a.team.pd);\n  const cnt={};teams.forEach(x=>{const k=x.team.h5||'—';cnt[k]=(cnt[k]||0)+1;});\n  const topH5=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0];\n  return{teams,topH5:topH5?topH5[0]:null};});};\nHIER_INTEL.critDep=function(){return this.memo('critdep',()=>\n  this.exposure().teams.filter(x=>x.domHit&&x.team.domShare>=0.6&&x.team.effLoc<=1.9)\n    .map(x=>({...x,flex:x.team.effLoc<=1.5?'muito baixa':'baixa'})));};\nHIER_INTEL.fit=function(originRec,destRec){\n  if(!HIER_PROFILE_AVAILABLE)return null;\n  const src=this.floorTeams(originRec.floor_id).slice(0,4);\n  if(!src.length)return null;\n  const mvs=this.moves();\n  let score=0,wsum=0;const impacted=[];const why=[];\n  src.forEach(x=>{\n    const t=x.team;\n    const destLoc=t.locs.find(l=>l.floorId===destRec.floor_id);\n    const destShare=destLoc?destLoc.share:0;\n    let s=30;\n    s+=55*Math.min(1,destShare/0.35);\n    if(t.dom&&t.dom.bid===destRec.building_id)s+=12;\n    if(t.cls==='distribuida')s+=8;\n    if(x.isDom&&t.cls==='fixa'&&!destShare)s-=20;\n    const mv=mvs.find(m=>m.team.key===t.key&&m.toBid);\n    if(mv&&mv.toBid===destRec.building_id)s+=12;\n    if(mv&&mv.fromBid===destRec.building_id)s-=8;\n    score+=Math.max(0,Math.min(100,s))*x.comp;wsum+=x.comp;\n    impacted.push({t,comp:x.comp,isDom:x.isDom,destShare});\n  });\n  // coesão H5: destino já hospeda equipes do mesmo H5?\n  const h5set=new Set(src.map(x=>x.team.h5).filter(Boolean));\n  if(this.floorTeams(destRec.floor_id).some(x=>h5set.has(x.team.h5)))score=Math.min(100,(wsum?score/wsum:0)+6),wsum=1;\n  else score=wsum?score/wsum:0;\n  score=Math.round(score);\n  const label=score>=65?'alta aderência':score>=45?'aderência média':'baixa aderência';\n  if(impacted[0])why.push(`${impacted[0].t.h6} representa ~${Math.round(impacted[0].comp*100)}% da presença histórica da origem${impacted[0].isDom?' (base dominante)':''}`);\n  const uses=impacted.filter(i=>i.destShare>0);\n  why.push(uses.length?`${uses.length} equipe${uses.length>1?'s':''} já utiliza${uses.length>1?'m':''} o destino`: 'nenhuma equipe da origem utiliza o destino hoje');\n  return{score,label,impacted:impacted.slice(0,3),why};\n};\nHIER_INTEL.planStrategies=function(p){\n  if(!HIER_PROFILE_AVAILABLE||!p.moves.length)return null;\n  const chosen=this.fit(p.origin,p.moves[0].rec);\n  if(!chosen)return null;\n  let bestAlt=null;\n  p.alts.forEach(a=>{const f=this.fit(p.origin,a.rec);if(f&&(!bestAlt||f.score>bestAlt.fit.score))bestAlt={alt:a,fit:f};});\n  const same=!bestAlt||bestAlt.fit.score<=chosen.score+8;\n  return{chosen,bestAlt,same,\n    txt:same?'O destino recomendado é simultaneamente a melhor alternativa de capacidade e de aderência organizacional.'\n    :`Trade-off: ${p.moves[0].rec.building_short} · ${andarLbl(p.moves[0].rec.andar)} tem mais capacidade segura, mas ${bestAlt.alt.rec.building_short} · ${andarLbl(bestAlt.alt.rec.andar)} tem maior afinidade com as equipes afetadas (${bestAlt.fit.score} vs ${chosen.score}). A capacidade permanece o critério decisivo.`};\n};\nHIER_INTEL.confidence=function(){return this.memo('conf',()=>{\n  const pd=HIER_PROFILE_DATA.reduce((s,r)=>s+r.pd,0);\n  const wk=new Set(HIER_TREND_DATA.map(r=>r.semana)).size;\n  const cov=this.coverage().pct;\n  if((HIER_PROFILE_AVAILABLE&&pd>=400&&cov>=85)&&(!HIER_TREND_AVAILABLE||wk>=4))return{cls:'grn',label:'Alta confiança',txt:`${pd.toLocaleString('pt-BR')} dias-pessoa${wk?` · ${wk} semanas`:''} · ${cov}% associados aos ativos.`};\n  if((HIER_PROFILE_AVAILABLE&&pd>=120)||wk>=3)return{cls:'amb',label:'Confiança moderada',txt:`${pd?pd.toLocaleString('pt-BR')+' dias-pessoa':'sem perfil de local'}${wk?` · ${wk} semana${wk>1?'s':''}`:' · sem tendência semanal'}${HIER_PROFILE_AVAILABLE?` · ${cov}% associados`:''}.`};\n  return{cls:'red',label:'Evidência limitada',txt:`Base pequena (${pd?pd+' dias-pessoa':'sem perfil'}${wk?`, ${wk} semana${wk>1?'s':''}`:''}) — leia os padrões como indicativos.`};\n});};\nHIER_INTEL.periods=function(){return this.memo('per',()=>{\n  const wks=[...new Set(HIER_TREND_DATA.map(r=>r.semana))].sort();\n  return{wFirst:wks[0]||null,wLast:wks[wks.length-1]||null,wN:wks.length,\n    fFirst:FORECAST_DATES[0]||null,fLast:FORECAST_DATES[FORECAST_DATES.length-1]||null};});};\n/* IDEIA AUTORAL HIERARQUIA 1: \"Coesão de Vizinhança\" — mede se os H6 de um mesmo H5 trabalham\n   fisicamente próximos (participação do principal prédio nos dias-pessoa do H5). Aponta H5 coesos,\n   parcialmente dispersos e fragmentados, e sinaliza risco de ruptura de vizinhança em redistribuições. */\nHIER_INTEL.cohesion=function(){return this.memo('cohesion',()=>{\n  if(!HIER_PROFILE_AVAILABLE)return [];\n  return this.h5List().filter(h=>h.teams.length>=2).map(h=>{\n    const tot=[...h.builds.values()].reduce((s,v)=>s+v,0)||1;\n    const top=[...h.builds.entries()].sort((a,b)=>b[1]-a[1])[0];\n    const topShare=top?top[1]/tot:0;\n    const topLabel=(HIER_LOCLABEL.get(top?top[0]+'|x':'')||{}).bLabel||(BUILDINGS_CONFIG.find(b=>b.id===top[0])||{}).short||top[0];\n    const cls=topShare>=0.65?'coeso':topShare>=0.4?'parcial':'fragmentado';\n    return{h5:h.h5,n:h.teams.length,pd:h.pd,topB:topLabel,topShare,cls,nB:h.builds.size,\n      txt:cls==='coeso'?`${Math.round(topShare*100)}% da presença em ${topLabel} — vizinhança preservada; redistribuições devem priorizar o mesmo prédio.`\n      :cls==='parcial'?`Dividido entre ${h.builds.size} prédios (principal: ${topLabel}, ${Math.round(topShare*100)}%). Há espaço para aproximar equipes.`\n      :`Fragmentado em ${h.builds.size} prédios — oportunidade de consolidação para recuperar vizinhança organizacional.`};\n  }).sort((a,b)=>b.pd-a.pd);});};\n/* IDEIA AUTORAL HIERARQUIA 2: \"Consolidação Inteligente\" — cruza equipes fragmentadas (multibase/\n   distribuídas) com a folga PREVISTA da própria base dominante: quando a base absorve com segurança a\n   presença que hoje fica espalhada, o ÁPICE recomenda consolidar — reduz fragmentação sem criar risco. */\nHIER_INTEL.consolidation=function(){return this.memo('consol',()=>{\n  if(!HIER_PROFILE_AVAILABLE)return [];\n  const out=[];\n  const moving=new Set(this.moves().filter(m=>m.to).map(m=>m.team.key));\n  this.teamList().forEach(t=>{\n    if(t.cls==='fixa'||!t.dom||!t.dom.floorId||moving.has(t.key))return;\n    const recs=APICE_DATA.filter(r=>r.floor_id===t.dom.floorId);\n    if(!recs.length)return;\n    const freeMin=Math.min(...recs.map(r=>Math.floor(r.capacidade*0.8)-r.pred_p50_andar));\n    if(freeMin<8)return;\n    const tr=this.trends().get(t.key);\n    const estOut=tr&&!tr.limited?Math.round(tr.recent*(1-t.domShare)):null;\n    if(estOut!=null&&estOut>freeMin)return;\n    out.push({team:t,freeMin,estOut,\n      txt:`Divide-se entre ${t.nF} locais (base: ${t.dom.label}, ${Math.round(t.domShare*100)}%). A base mantém ≥${freeMin} posições livres na semana prevista${estOut!=null?` — comporta as ~${estOut} pessoas que hoje ficam fora dela (estimativa histórica)`:''}. Consolidar reduz fragmentação sem criar pressão.`});\n  });\n  return out.sort((a,b)=>b.freeMin-a.freeMin).slice(0,4);});};\n\n/* Integrações compactas */\nfunction hierRadarTile(){\n  if(!HIER_AVAILABLE)return'';\n  const ex=HIER_INTEL.exposure(),cd=HIER_INTEL.critDep(),mv=HIER_INTEL.moves().filter(m=>m.toBid||m.status==='alternância');\n  return `<button class=\"rtile\" onclick=\"switchTab('teams')\">\n    <div class=\"rtile-k\"><i style=\"background:var(--blu)\"><\/i>Equipes expostas<\/div>\n    <div class=\"rtile-main\">${ex.teams.length?`${ex.teams.length} equipe${ex.teams.length>1?'s':''} em andares sob risco`:'Nenhuma equipe exposta'}<\/div>\n    <div class=\"rtile-sub\">${cd.length?`${cd.length} com dependência crítica de base`:mv.length?`${mv.length} mudança${mv.length>1?'s':''} de base detectada${mv.length>1?'s':''}`:ex.topH5?`Principal H5: ${ex.topH5}`:'Padrões organizacionais estáveis'}<\/div>\n    <span class=\"rtile-cta\">Ver impacto organizacional<\/span>\n  <\/button>`;\n}\nfunction modalHierBlock(rec){\n  if(!HIER_AVAILABLE)return'';\n  if(!HIER_PROFILE_AVAILABLE)return `<div style=\"margin-top:14px;font-size:12px;color:var(--tx-mut)\">Perfil de localização das equipes não disponível neste recorte.<\/div>`;\n  const ft=HIER_INTEL.floorTeams(rec.floor_id);\n  if(!ft.length)return `<div style=\"margin-top:14px;font-size:12px;color:var(--tx-mut)\">Nenhuma equipe com presença histórica relevante neste andar.<\/div>`;\n  const domN=ft.filter(x=>x.isDom).length;\n  const impact=domN&&ft[0].comp>=0.5?'impacto organizacional alto':domN?'impacto organizacional moderado':'impacto organizacional disperso';\n  return `<div style=\"margin-top:18px\">\n    <div style=\"font-size:12px;font-weight:600;text-transform:uppercase;color:var(--tx-mut);letter-spacing:.08em;margin-bottom:8px\">Equipes neste andar · <span style=\"color:var(--${domN?'amb':'blu'})\">${impact}<\/span><\/div>\n    ${ft.slice(0,3).map(x=>`<div class=\"sb-kv\"><span>${x.team.h6}${x.team.h5?` <span style=\"color:var(--tx-mut)\">· ${x.team.h5}<\/span>`:''}<\/span><b>~${Math.round(x.comp*100)}% da presença${x.isDom?' · base dominante':''}<\/b><\/div>`).join('')}\n    ${ft.length>3?`<div style=\"font-size:11.5px;color:var(--tx-mut);margin-top:4px\">+ ${ft.length-3} outras equipes<\/div>`:''}\n    <div style=\"font-size:11px;color:var(--tx-mut);margin-top:8px\">Composição estimada a partir de dias-pessoa históricos.<\/div>\n  <\/div>`;\n}\nfunction planFitHTML(p){\n  if(!HIER_PROFILE_AVAILABLE||!p.moves.length)return'';\n  const st=HIER_INTEL.planStrategies(p);\n  if(!st)return'';\n  return `<div style=\"margin-top:14px;padding-top:12px;border-top:1px dashed rgba(232,234,237,.95)\">\n    <h5>Aderência organizacional <span class=\"conf ${st.chosen.score>=65?'c3':st.chosen.score>=45?'c2':'c1'}\" style=\"vertical-align:1px\"><i><\/i>${st.chosen.score}/100<\/span><\/h5>\n    <p style=\"font-size:12.5px\">${st.chosen.impacted.map(i=>`<b style=\"color:var(--tx-main);font-weight:600\">${i.t.h6}<\/b> (~${Math.round(i.comp*100)}%${i.isDom?', base dominante':''}${i.destShare?`, já usa o destino em ${Math.round(i.destShare*100)}%`:''})`).join('; ')}.<\/p>\n    <p style=\"font-size:12.5px;margin-top:8px\">${st.txt}<\/p>\n    <p style=\"font-size:11px;color:var(--tx-mut);margin-top:6px\">Composição estimada por dias-pessoa históricos — não é contagem real de pessoas.<\/p>\n  <\/div>`;\n}\nfunction r3dFitBlock(p){\n  if(!HIER_PROFILE_AVAILABLE||!p.moves.length)return'';\n  const st=HIER_INTEL.planStrategies(p);\n  if(!st)return'';\n  return `<div class=\"sb\">\n    <h6>Impacto por equipe · aderência ${st.chosen.score}/100<\/h6>\n    ${st.chosen.impacted.map(i=>`<div class=\"sb-kv\"><span>${i.t.h6}<\/span><b>~${Math.round(i.comp*100)}%${i.isDom?' · base':''}${i.destShare?` · usa destino ${Math.round(i.destShare*100)}%`:''}<\/b><\/div>`).join('')}\n    <div style=\"font-size:11px;color:var(--tx-mut);margin-top:8px;line-height:1.5\">${st.txt} Composição estimada a partir dos dias-pessoa históricos.<\/div>\n  <\/div>`;\n}\nfunction winHierLine(r){\n  if(!HIER_PROFILE_AVAILABLE)return'';\n  const ft=HIER_INTEL.floorTeams(r.floor_id);\n  if(!ft.length)return'';\n  const dom=ft.filter(x=>x.isDom);\n  const inflex=dom.filter(x=>x.team.effLoc<=1.9).length;\n  if(dom.length)return `<div class=\"win-restr\" style=\"background:var(--blu-lt);color:#075E7D\">Base dominante de ${dom.length} equipe${dom.length>1?'s':''}${inflex?` — ${inflex} com baixa flexibilidade espacial`:''}; comunicar com antecedência.<\/div>`;\n  return `<div class=\"win-restr\" style=\"background:var(--grn-lt);color:#14532d\">Equipes deste andar têm padrão flexível — impacto organizacional baixo.<\/div>`;\n}\n\n/* RENDER TEAMS — Equipes e Hierarquias */\nfunction tmClsChip(cls){const m={fixa:['grn','Base fixa'],multibase:['blu','Multibase'],distribuida:['amb','Distribuída']};const c=m[cls]||['blu',cls];return `<span class=\"chip ${c[0]}\" title=\"Base fixa: ≥60% em um local · Multibase: 2-3 locais relevantes · Distribuída: sem local dominante — limites operacionais, não regra absoluta\">${c[1]}<\/span>`;}\nfunction tmTrendChip(k){\n  const tr=HIER_INTEL.trends().get(k);\n  if(!tr)return'';\n  if(tr.limited)return `<span class=\"chip blu\" title=\"Menos de 4 semanas — evidência limitada\">${tr.n} sem.<\/span>`;\n  const m={alta:['red','▲ +'+Math.abs(tr.deltaPct)+'%'],queda:['grn','▼ −'+Math.abs(tr.deltaPct)+'%'],estavel:['blu','estável']};\n  const c=m[tr.dir];return c?`<span class=\"chip ${c[0]}\" title=\"Últimas ${Math.min(3,tr.n)} semanas vs período anterior\">${c[1]}<\/span>`:'';\n}\nfunction weekSpark(tr){\n  if(!tr||tr.n<2)return'';\n  const W=300,H=64,L=6,B=14;\n  const max=Math.max(...tr.weeks.map(w=>w.pessoas),1);\n  const X=i=>L+i/(tr.n-1)*(W-2*L);\n  const Y=v=>6+(1-v/max)*(H-6-B);\n  const pts=tr.weeks.map((w,i)=>`${X(i).toFixed(1)},${Y(w.pessoas).toFixed(1)}`).join(' ');\n  return `<svg viewBox=\"0 0 ${W} ${H}\" style=\"width:100%;height:auto;display:block\">\n    <polyline points=\"${pts}\" fill=\"none\" stroke=\"#008DC0\" stroke-width=\"2\" stroke-linejoin=\"round\"/>\n    ${tr.weeks.map((w,i)=>`<circle cx=\"${X(i)}\" cy=\"${Y(w.pessoas)}\" r=\"2.4\" fill=\"#008DC0\"><title>${fd(w.semana)}: ${w.pessoas} pessoas<\/title><\/circle>`).join('')}\n    <text x=\"${L}\" y=\"${H-2}\" font-size=\"9\" fill=\"#9AA0A6\" font-family=\"Inter,sans-serif\">${fd(tr.weeks[0].semana)}<\/text>\n    <text x=\"${W-L}\" y=\"${H-2}\" text-anchor=\"end\" font-size=\"9\" fill=\"#9AA0A6\" font-family=\"Inter,sans-serif\">${fd(tr.weeks[tr.n-1].semana)}<\/text>\n  <\/svg>`;\n}\nfunction tmSelect(k){S.tmSel=k;renderTeams();}\nfunction tmSetH4(v){S.tmH4=v;S.tmH5='';S.tmH6='';S.tmSel=null;renderTeams();}\nfunction tmSetH5(v){S.tmH5=v;S.tmH6='';S.tmSel=null;renderTeams();}\nfunction tmSetH6(v){S.tmH6=v;S.tmSel=null;renderTeams();}\nfunction tmSetCls(v){S.tmCls=S.tmCls===v?'':v;renderTeams();}\nfunction renderTeams(){\n  const panel=document.getElementById('panel-teams');\n  if(!panel)return;\n  if(!HIER_AVAILABLE){\n    panel.innerHTML=`<div class=\"empty-wrap\" style=\"min-height:46vh\"><div class=\"empty-card\" style=\"padding:44px 40px\">\n      <div class=\"empty-mark\" style=\"font-size:24px\">ÁPICE<\/div>\n      <h1 style=\"font-size:22px\">Dados de hierarquia não disponíveis neste recorte<\/h1>\n      <p>O painel principal continua completo. Para ativar a inteligência organizacional (H4/H5/H6), preencha o bloco opcional <code style=\"background:var(--surface-alt);border:1px solid var(--border);border-radius:6px;padding:1px 7px;font-size:12px;color:var(--org)\">APICE_HIERARQUIA_EDITAVEL<\/code> no início do arquivo com <b>perfil_local<\/b> e/ou <b>tendencia_semanal<\/b>.<\/p>\n    <\/div><\/div>`;\n    return;\n  }\n  const conf=HIER_INTEL.confidence();\n  const per=HIER_INTEL.periods();\n  const cov=HIER_INTEL.coverage();\n  const all=HIER_INTEL.teamList();\n  const h5s=HIER_INTEL.h5List();\n  const ex=HIER_INTEL.exposure();\n  const cd=HIER_INTEL.critDep();\n  const mvs=HIER_INTEL.moves();\n  const coh=HIER_INTEL.cohesion();\n  const cons=HIER_INTEL.consolidation();\n  const nFixa=all.filter(t=>t.cls==='fixa').length,nMulti=all.filter(t=>t.cls==='multibase').length,nDist=all.filter(t=>t.cls==='distribuida').length;\n  let list=all;\n  if(S.tmH4)list=list.filter(t=>(t.h4||'(sem H4)')===S.tmH4);\n  if(S.tmH5)list=list.filter(t=>(t.h5||'(sem H5)')===S.tmH5);\n  if(S.tmH6)list=list.filter(t=>(t.h6||'(sem H6)')===S.tmH6);\n  if(S.tmCls)list=list.filter(t=>t.cls===S.tmCls);\n  if(!S.tmSel||!list.find(t=>t.key===S.tmSel))S.tmSel=(list.find(t=>ex.teams.some(x=>x.team.key===t.key))||list[0]||{}).key||null;\n  const sel=S.tmSel?HIER_INTEL.teams().get(S.tmSel):null;\n  const selTr=sel?HIER_INTEL.trends().get(sel.key):null;\n  const selMv=sel?mvs.find(m=>m.team.key===sel.key):null;\n  const selEx=sel?ex.teams.find(x=>x.team.key===sel.key):null;\n  const h4s=[...new Set(all.map(t=>t.h4).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt-BR'));\n  const h5Options=[...new Set(all.filter(t=>!S.tmH4||t.h4===S.tmH4).map(t=>t.h5).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt-BR'));\n  const h6Options=[...new Set(all.filter(t=>(!S.tmH4||t.h4===S.tmH4)&&(!S.tmH5||t.h5===S.tmH5)).map(t=>t.h6).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt-BR'));\n  panel.innerHTML=`\n  <div style=\"margin-bottom:34px\">\n    <h1 class=\"sec-title\">Equipes e Hierarquias<\/h1>\n    <p class=\"sec-desc\" style=\"margin-bottom:10px\">Onde cada equipe trabalha, quem depende de cada andar e quem está mudando de base — camada organizacional agregada (sem dados individuais).<\/p>\n    <div style=\"display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--tx-sec)\">\n      <span class=\"conf ${conf.cls==='grn'?'c3':conf.cls==='amb'?'c2':'c1'}\" title=\"${conf.txt}\"><i><\/i>${conf.label}<\/span>\n      <span>Previsão: <b>${per.fFirst?`${fd(per.fFirst)}–${fd(per.fLast)}`:'—'}<\/b><\/span>\n      <span>Hierarquia: <b>${per.wN?`${per.wN} semanas (até ${fd(per.wLast)})`:'perfil agregado'}<\/b><\/span>\n      ${HIER_PROFILE_AVAILABLE?`<span>Cobertura: <b>${cov.pct}%<\/b> dos dias-pessoa associados aos ativos<\/span>`:''}\n      ${h4s.length?`<span>H4: <b>${h4s.length}<\/b><\/span>`:''}\n    <\/div>\n  <\/div>\n  <div class=\"g4\" style=\"margin-bottom:34px\">\n    <div class=\"metric-card blu\"><div class=\"metric-lbl\">Equipes mapeadas<\/div><div class=\"metric-val\" style=\"color:var(--blu)\">${all.length}<\/div><div class=\"metric-sub\">${h5s.length} H5${h4s.length?` · ${h4s.length} H4`:''} · ${cov.tot.toLocaleString('pt-BR')} dias-pessoa<\/div><div class=\"metric-trend info\">${nFixa} fixa · ${nMulti} multibase · ${nDist} distribuída<\/div><\/div>\n    <div class=\"metric-card red\"><div class=\"metric-lbl\">Expostas a risco<\/div><div class=\"metric-val\" style=\"color:var(--${ex.teams.length?'red':'grn'})\">${ex.teams.length}<\/div><div class=\"metric-sub\">com presença ≥20% em andares em atenção ou críticos<\/div><div class=\"metric-trend ${cd.length?'up':'down'}\">${cd.length} dependência${cd.length!==1?'s':''} crítica${cd.length!==1?'s':''}<\/div><\/div>\n    <div class=\"metric-card amb\"><div class=\"metric-lbl\">Mudanças de base<\/div><div class=\"metric-val\" style=\"color:var(--amb)\">${mvs.filter(m=>m.to).length}<\/div><div class=\"metric-sub\">${HIER_TREND_AVAILABLE?`detectadas nas últimas ${per.wN} semanas`:'requer tendência semanal'}<\/div><div class=\"metric-trend info\">${mvs.filter(m=>m.status==='consolidada').length} consolidada${mvs.filter(m=>m.status==='consolidada').length!==1?'s':''}<\/div><\/div>\n    <div class=\"metric-card grn\"><div class=\"metric-lbl\">Cobertura da associação<\/div><div class=\"metric-val\" style=\"color:var(--grn)\">${HIER_PROFILE_AVAILABLE?cov.pct+'%':'--'}<\/div><div class=\"metric-sub\">dias-pessoa vinculados aos prédios do ÁPICE<\/div><div class=\"metric-trend ${cov.pct>=85?'down':'info'}\">${cov.pct>=85?'associação sólida':'há torres não associadas'}<\/div><\/div>\n  <\/div>\n  <div class=\"dgrid\" style=\"grid-template-columns:.95fr 1.15fr\">\n    <section class=\"rail-card\">\n      <div class=\"rail-hd\"><div class=\"rail-title\">Explorer H4 → H5 → H6<\/div><div class=\"rail-sub\">${list.length} equipe${list.length!==1?'s':''}<\/div><\/div>\n      <div style=\"display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 12px\">\n        <select class=\"f-sel\" style=\"height:34px;font-size:12px;max-width:100%\" onchange=\"tmSetH4(this.value)\">\n          <option value=\"\">Todos os H4<\/option>\n          ${h4s.map(h=>`<option value=\"${h.replace(/\"/g,'')}\" ${S.tmH4===h?'selected':''}>${h}<\/option>`).join('')}\n        <\/select>\n        <select class=\"f-sel\" style=\"height:34px;font-size:12px;max-width:100%\" onchange=\"tmSetH5(this.value)\">\n          <option value=\"\">Todos os H5<\/option>\n          ${h5Options.map(h=>`<option value=\"${h.replace(/\"/g,'')}\" ${S.tmH5===h?'selected':''}>${h}<\/option>`).join('')}\n        <\/select>\n        <select class=\"f-sel\" style=\"height:34px;font-size:12px;max-width:100%\" onchange=\"tmSetH6(this.value)\">\n          <option value=\"\">Todos os H6<\/option>\n          ${h6Options.map(h=>`<option value=\"${h.replace(/\"/g,'')}\" ${S.tmH6===h?'selected':''}>${h}<\/option>`).join('')}\n        <\/select>\n        <div style=\"display:flex;gap:6px;flex-wrap:wrap\">\n          ${[['fixa','Base fixa'],['multibase','Multibase'],['distribuida','Distribuída']].map(c=>`<button class=\"bchip ${S.tmCls===c[0]?'on':''}\" style=\"padding:6px 12px;font-size:11.5px\" onclick=\"tmSetCls('${c[0]}')\">${c[1]}<\/button>`).join('')}\n        <\/div>\n      <\/div>\n      <div class=\"rk-list\" style=\"max-height:520px;overflow:auto;padding-right:4px\">\n        ${list.slice(0,60).map(t=>{\n          const exT=ex.teams.find(x=>x.team.key===t.key);\n          return `<div class=\"rk-row ${t.key===S.tmSel?'on':''}\" style=\"${t.key===S.tmSel?'background:var(--blu-lt);border-radius:12px;padding-left:8px;padding-right:8px;':''}\" onclick=\"tmSelect('${t.key}')\">\n          <div class=\"rk-rank ${exT&&exT.worst==='CRITICO'?'red':''}\" style=\"${!exT?'background:var(--surface-alt);color:var(--tx-mut)':''}\">${exT?'!':''}${!exT?'·':''}<\/div>\n          <div class=\"rk-main\">\n            <div class=\"rk-place\">${t.h6} ${tmClsChip(t.cls)}<\/div>\n            <div class=\"rk-note\">${t.h5||'—'}${t.h4?` · ${t.h4}`:''} · ${t.dom?t.dom.label:'sem local'} (${Math.round(t.domShare*100)}%)<\/div>\n          <\/div>\n          <div class=\"rk-delta\"><b style=\"font-size:13px\">${t.pd.toLocaleString('pt-BR')}<\/b><span>dias-pessoa<\/span><\/div>\n        <\/div>`;}).join('')||'<p style=\"font-size:12.5px;color:var(--tx-sec);padding:8px 0\">Nenhuma equipe no filtro atual.<\/p>'}\n      <\/div>\n    <\/section>\n    <section class=\"rail-card\">\n      ${sel?`\n      <div class=\"rail-hd\"><div><div class=\"rail-title\">${sel.h6}<\/div><div class=\"rail-sub\">${sel.h4?sel.h4+' → ':''}${sel.h5||'—'} · ${sel.pd.toLocaleString('pt-BR')} dias-pessoa<\/div><\/div><div style=\"display:flex;gap:6px;align-items:center\">${tmClsChip(sel.cls)}${tmTrendChip(sel.key)}<\/div><\/div>\n      <h5 style=\"font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--tx-mut);margin:16px 0 10px\">Mapa de casa<\/h5>\n      <div class=\"xrows\" style=\"gap:11px\">\n        ${sel.locs.slice(0,4).map(l=>`<div class=\"xrow\" style=\"grid-template-columns:minmax(120px,150px) 1fr auto\">\n          <div class=\"xlbl\">${l.label}<span>${l.matched?'':'torre não associada · '}${l.pd.toLocaleString('pt-BR')} d-p<\/span><\/div>\n          <div class=\"xbar\"><div class=\"xfill\" style=\"width:${Math.max(3,Math.round(l.share*100))}%;background:var(--${l.lk===(sel.dom&&sel.dom.lk)?'org':'blu'})\"><\/div><\/div>\n          <div class=\"xnum\"><b>${Math.round(l.share*100)}%<\/b><\/div>\n        <\/div>`).join('')}\n        ${sel.locs.length>4?`<div style=\"font-size:11px;color:var(--tx-mut)\">+ ${sel.locs.length-4} outros locais<\/div>`:''}\n      <\/div>\n      <div style=\"font-size:12px;color:var(--tx-sec);margin-top:10px;line-height:1.6\">${sel.cls==='fixa'?`A equipe utiliza ${sel.dom.label} em ${Math.round(sel.domShare*100)}% dos dias-pessoa — base fixa.`:sel.cls==='multibase'?`Divide-se principalmente entre ${sel.locs.slice(0,2).map(l=>l.label).join(' e ')}.`:`Nenhum local representa mais de ${Math.round(sel.domShare*100)}% — padrão distribuído (nº efetivo de locais: ${rnd1(sel.effLoc)}).`}<\/div>\n      ${selTr?`\n      <h5 style=\"font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--tx-mut);margin:18px 0 8px\">Presença semanal (pessoas distintas)<\/h5>\n      ${weekSpark(selTr)}\n      <div style=\"font-size:12px;color:var(--tx-sec);margin-top:6px;line-height:1.6\">${selTr.limited?`Apenas ${selTr.n} semana${selTr.n>1?'s':''} — evidência limitada para tendência.`:selTr.dir==='alta'?`Comparecimento em alta: +${Math.abs(selTr.deltaPct)}% nas últimas semanas (média recente ${selTr.recent} vs ${selTr.prior}).`:selTr.dir==='queda'?`Comparecimento em queda: −${Math.abs(selTr.deltaPct)}% nas últimas semanas (${selTr.recent} vs ${selTr.prior}).`:`Volume estável (~${selTr.recent} pessoas/semana${selTr.vol>25?', com alta volatilidade':''}).`}<\/div>`\n      :'<div style=\"font-size:12px;color:var(--tx-mut);margin-top:14px\">Tendência semanal não disponível para esta equipe.<\/div>'}\n      ${selMv?`<div class=\"vband\" style=\"margin-top:14px\"><i style=\"background:var(--amb)\"><\/i><span><b>Mudança de ${selMv.kind==='prédio'?'prédio':'andar'} detectada.<\/b> ${selMv.txt}${sel.dom&&selMv.to&&sel.dom.lk!==selMv.to?' O perfil histórico ainda aponta a base antiga — padrão recente prevalece.':''}<\/span><\/div>`:''}\n      ${selEx?`<div class=\"vband\" style=\"margin-top:12px\"><i style=\"background:var(--${selEx.worst==='CRITICO'?'red':'amb'})\"><\/i><span><b>Exposição a risco previsto.<\/b> ${selEx.items.map(i=>`${i.loc.label} (${nlbl(i.nivel)}, ${Math.round(i.loc.share*100)}% da presença)`).join('; ')}.${selEx.domHit?' Inclui a base dominante.':''}<\/span><\/div>`:''}\n      <div style=\"display:flex;gap:8px;flex-wrap:wrap;margin-top:16px\">\n        ${sel.dom&&sel.dom.bid?`<button class=\"dbtn pri\" onclick=\"goToBuildingFloor('${sel.dom.bid}','${String(sel.dom.andar).replace(/'/g,'')}')\">Abrir base no 3D<\/button>`:''}\n        ${sel.dom&&sel.dom.floorId?`<button class=\"dbtn\" onclick=\"openModal('${sel.dom.floorId}','${FORECAST_DATES[0]||''}')\">Previsão do andar<\/button>`:''}\n      <\/div>`\n      :'<p style=\"font-size:13px;color:var(--tx-sec)\">Selecione uma equipe para ver o perfil.<\/p>'}\n    <\/section>\n  <\/div>\n  ${cd.length?`\n  <section class=\"card\" style=\"padding:28px 32px;margin:44px 0 0;border-color:rgba(217,48,37,.25)\">\n    <div class=\"chart-kicker\">dependência crítica de base<\/div>\n    <div class=\"chart-title\">Equipes presas a andares sob pressão<\/div>\n    <div class=\"chart-sub\">Alta concentração em uma única base + risco previsto no local + poucas alternativas históricas<\/div>\n    <div class=\"rk-list\" style=\"margin-top:10px\">\n      ${cd.slice(0,5).map(x=>`<div class=\"rk-row\" onclick=\"tmSelect('${x.team.key}')\">\n        <div class=\"rk-rank red\">!<\/div>\n        <div class=\"rk-main\"><div class=\"rk-place\">${x.team.h6} <span class=\"chip red\">${nlbl(x.worst)}<\/span><\/div>\n        <div class=\"rk-note\">${Math.round(x.team.domShare*100)}% da presença em ${x.team.dom.label} · flexibilidade ${x.flex} (${x.team.nF} local${x.team.nF>1?'is':''}) · preparar alternativa antes do pico<\/div><\/div>\n        <div class=\"rk-delta\"><b>${Math.round(x.team.domShare*100)}%<\/b><span>na base<\/span><\/div>\n      <\/div>`).join('')}\n    <\/div>\n  <\/section>`:''}\n  <div class=\"g2\" style=\"margin-top:44px\">\n    <section class=\"card sync-card\" style=\"padding:28px 32px\">\n      \n      <div class=\"chart-title\" style=\"margin-top:12px\">Coesão de Vizinhança<\/div>\n      <div class=\"chart-sub\">Os H6 de um mesmo H5 trabalham próximos? Coesão = participação do principal prédio nos dias-pessoa do H5.<\/div>\n      ${coh.length?`<div class=\"rk-list\" style=\"margin-top:8px\">${coh.slice(0,5).map(h=>`\n        <div class=\"rk-row\" onclick=\"tmSetH5('${h.h5.replace(/'/g,'')}')\">\n          <div class=\"rk-rank ${h.cls==='fragmentado'?'red':''}\" style=\"${h.cls==='coeso'?'background:var(--grn-lt);color:var(--grn)':''}\">${h.n}<\/div>\n          <div class=\"rk-main\"><div class=\"rk-place\">${h.h5} <span class=\"chip ${h.cls==='coeso'?'grn':h.cls==='parcial'?'blu':'amb'}\">${h.cls}<\/span><\/div><div class=\"rk-note\">${h.txt}<\/div><\/div>\n          <div class=\"rk-delta\"><b>${Math.round(h.topShare*100)}%<\/b><span>${h.topB}<\/span><\/div>\n        <\/div>`).join('')}<\/div>`\n      :'<p style=\"font-size:12.5px;color:var(--tx-sec);margin-top:12px\">Requer perfil de local com 2+ equipes por H5.<\/p>'}\n    <\/section>\n    <section class=\"card sync-card\" style=\"padding:28px 32px\">\n      \n      <div class=\"chart-title\" style=\"margin-top:12px\">Consolidação Inteligente<\/div>\n      <div class=\"chart-sub\">Equipes fragmentadas cuja base dominante tem folga prevista para recebê-las por inteiro — menos fragmentação, sem criar risco.<\/div>\n      ${cons.length?cons.map(c=>`<div class=\"vband\" style=\"margin-top:12px;cursor:pointer\" onclick=\"tmSelect('${c.team.key}')\"><i style=\"background:var(--grn)\"><\/i><span><b>${c.team.h6}.<\/b> ${c.txt}<\/span><\/div>`).join('')\n      :'<p style=\"font-size:12.5px;color:var(--tx-sec);margin-top:12px\">Nenhuma consolidação segura identificada — bases dominantes sem folga suficiente ou equipes já concentradas.<\/p>'}\n    <\/section>\n  <\/div>\n  <p style=\"font-size:11.5px;color:var(--tx-mut);line-height:1.7;max-width:920px;margin-top:26px\">Camada organizacional 100% agregada (H4/H5/H6) — sem listas de pessoas, sem identificação individual. Perfil histórico define afinidade; semanas recentes detectam mudanças (padrão recente prevalece quando persistente). Classificações: base fixa ≥60% em um local; multibase 2–3 locais relevantes; distribuída sem dominância — limites operacionais, não regra absoluta.<\/p>`;\n}\n\n/* RENDER STRATEGY — Central de Decisão (v3) */\nfunction xrowHTML(label,sub,before,after){\n  const tier=occKey(after);\n  return `<div class=\"xrow\">\n    <div class=\"xlbl\">${label}<span>${sub}<\/span><\/div>\n    <div class=\"xbar\">\n      <div class=\"xth\" style=\"left:80%\"><\/div><div class=\"xth\" style=\"left:90%\"><\/div>\n      <div class=\"xfill\" style=\"width:${Math.min(100,Math.max(2,after))}%;background:var(--${tier})\"><\/div>\n      ${before!=null?`<div class=\"xwas\" style=\"left:${Math.min(100,before)}%\"><\/div>`:''}\n    <\/div>\n    <div class=\"xnum\">${before!=null?`${rnd1(before)}% → `:''}<b style=\"color:var(--${tier})\">${rnd1(after)}%<\/b><\/div>\n  <\/div>`;\n}\nfunction planTitle(p){\n  const o=p.origin;\n  if(!p.moves.length)return `Sem destino seguro para o excesso de ${p.excess} pessoas — ${o.building_short}, ${andarLbl(o.andar)}`;\n  const dest=p.moves.map(m=>m.same?andarLbl(m.rec.andar):`${m.rec.building_short} · ${andarLbl(m.rec.andar)}`).join(' + ');\n  return `Redistribuir ${p.moved} pessoas do ${andarLbl(o.andar)} para ${dest} — ${o.building_short}`;\n}\nfunction planNarrative(p){\n  const o=p.origin;\n  if(!p.moves.length)return `O ${andarLbl(o.andar)} do ${o.building_nome} opera a ${rnd1(p.oBefore)}% em ${fdd(p.date)} (${o.pred_p50_andar} pessoas para ${o.capacidade} posições), mas não há capacidade segura disponível no portfólio nesta data. Excesso de ${p.excess} pessoas sem destino recomendado — considerar orientação de trabalho remoto ou escalonamento de horários.`;\n  const parts=p.moves.map(m=>`${m.qty} pessoas para o ${andarLbl(m.rec.andar)}${m.same?'':` do ${m.rec.building_nome}`} (${rnd1(m.before)}% → ${rnd1(m.after)}%, P90 ${rnd1(m.after90)}%)`);\n  let s=`O ${andarLbl(o.andar)} do ${o.building_nome} opera a ${rnd1(p.oBefore)}% em ${fdd(p.date)} — ${o.pred_p50_andar} pessoas para ${o.capacidade} posições. Mover ${parts.join(' e ')} reduz a origem para ${p.oAfter}%${p.oAfter90>=100?'; atenção: no cenário máximo (P90) a origem ainda excede a capacidade':` (P90 pós-ação: ${p.oAfter90}%)`}. `;\n  if(p.residual>0)s+=`A capacidade disponível absorve ${p.absorb}% do excesso — permanecem ${p.residual} pessoas sem destino recomendado.`;\n  else s+=`O excesso é absorvido integralmente e nenhum destino ultrapassa 80% no cenário central nem 95% no cenário máximo.`;\n  return s;\n}\nfunction planResidLabel(p){return p.oAfter>=90?'crítico':p.oAfter>=80?'atenção':'controlado';}\nfunction dcardPlan(p,repeats){\n  return `<div class=\"dcard sev-red\" id=\"dcp-${p.id}\">\n    <div class=\"dhead\" onclick=\"toggleDcard('dcp-${p.id}')\">\n      <div class=\"dhead-main\">\n        <div class=\"dtop\">\n          <span class=\"dkind red\">Redistribuição<\/span>\n          <span class=\"conf ${p.conf.cls}\" title=\"${p.conf.desc}\"><
